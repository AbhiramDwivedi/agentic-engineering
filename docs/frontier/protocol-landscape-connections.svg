<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 604" width="800" height="604" role="img" aria-labelledby="ttl desc">
  <title id="ttl">The protocol landscape: four kinds of connection, each with its own protocols, and every reply passing one authority check in your code</title>
  <desc id="desc">A rounded box labelled "your agent", where the model decides to delegate, sends four lanes, one per connection: MCP to tools and data, A2A to an opaque remote agent, MCP Apps, A2UI and AG-UI to a person, and UCP, ACP, AP2, x402 and MPP to a merchant and payer. Every reply returns along one rail into a single box, "your code: authority check", which asks whether this agent may act, with this party, for this amount, and passes or refuses before any action.</desc>
  <style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 18px; font-weight: 700; }
  .h2 { font-size: 12.5px; }
  .box-t { font-size: 13px; font-weight: 700; }
  .proto-t { font-size: 12.5px; font-weight: 700; }
  .sub { font-size: 11px; }
  .lane-k { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  .foot-t { font-size: 12.5px; font-weight: 700; }

  .code-box, .model-box, .soft-box { stroke-width: 2; }
  .wire { fill: none; stroke-width: 2; }
  .rail { fill: none; stroke-width: 2.5; }
  .rule { stroke-width: 1; }

  .page-bg { fill: #ffffff; stroke: #e2e6ef; stroke-width: 1; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .soft-box { fill: #f7f8fb; stroke: #ccd2e0; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #6a45b0; }
  .txt-esc { fill: #c62828; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .rail { stroke: #4f5b93; }  .mk-code { fill: #4f5b93; }
  .rule { stroke: #e2e6ef; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #21222c; stroke: #2b3140; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .soft-box { fill: #1b1f29; stroke: #3a4155; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #c4aee8; }
  .txt-esc { fill: #ff8a80; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .rail { stroke: #939ed4; }  .mk-code { fill: #939ed4; }
  .rule { stroke: #2b3140; }
  }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="mk-wire"/>
    </marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="mk-code"/>
    </marker>
  </defs>

  <rect class="page-bg" x="0.5" y="0.5" width="799" height="603" rx="10"/>

  <!-- Heading -->
  <text class="h1 txt" x="24" y="32">Four kinds of connection, one authority check</text>
  <text class="h2 txt-mute" x="24" y="52">Pick the protocol per connection. Whatever comes back, your code decides whether to act on it.</text>

  <!-- Column keys -->
  <text class="lane-k txt-mute" x="170" y="80">PROTOCOL AND MATURITY</text>
  <text class="lane-k txt-mute" x="472" y="80">THE OTHER END</text>

  <!-- Your agent (the model decides to delegate) -->
  <rect class="model-box" x="20" y="92" width="130" height="316" rx="26"/>
  <text class="box-t txt" x="85" y="240" text-anchor="middle">Your agent</text>
  <text class="sub txt-model" x="85" y="258" text-anchor="middle">the model decides</text>
  <text class="sub txt-model" x="85" y="272" text-anchor="middle">to delegate</text>

  <!-- Lane 1: tools and data -->
  <line class="wire" x1="150" y1="120" x2="466" y2="120" marker-end="url(#ar)"/>
  <text class="proto-t txt" x="170" y="112">MCP</text>
  <text class="sub txt-mute" x="170" y="136">Standard (revision 2026-07-28: Emerging)</text>
  <rect class="soft-box" x="470" y="92" width="170" height="56" rx="6"/>
  <text class="box-t txt" x="555" y="125" text-anchor="middle">Tools and data</text>

  <!-- Lane 2: opaque remote agent -->
  <line class="wire" x1="150" y1="208" x2="466" y2="208" marker-end="url(#ar)"/>
  <text class="proto-t txt" x="170" y="200">A2A</text>
  <text class="sub txt-mute" x="170" y="224">Emerging</text>
  <rect class="soft-box" x="470" y="180" width="170" height="56" rx="6"/>
  <text class="box-t txt" x="555" y="205" text-anchor="middle">Opaque remote agent</text>
  <text class="sub txt-mute" x="555" y="222" text-anchor="middle">its state stays hidden</text>

  <!-- Lane 3: person at a screen -->
  <line class="wire" x1="150" y1="296" x2="466" y2="296" marker-end="url(#ar)"/>
  <text class="proto-t txt" x="170" y="288">MCP Apps · A2UI · AG-UI</text>
  <text class="sub txt-mute" x="170" y="312">Emerging</text>
  <rect class="soft-box" x="470" y="268" width="170" height="56" rx="6"/>
  <text class="box-t txt" x="555" y="301" text-anchor="middle">A person at a screen</text>

  <!-- Lane 4: merchant and payer -->
  <line class="wire" x1="150" y1="384" x2="466" y2="384" marker-end="url(#ar)"/>
  <text class="proto-t txt" x="170" y="376">UCP or ACP, competing for checkout</text>
  <text class="sub txt" x="170" y="400">beneath: AP2 · x402 · MPP</text>
  <text class="sub txt-mute" x="170" y="415">Emerging; adoption Contested</text>
  <rect class="soft-box" x="470" y="356" width="170" height="56" rx="6"/>
  <text class="box-t txt" x="555" y="389" text-anchor="middle">Merchant and payer</text>

  <!-- Return rail: every reply comes back the same way -->
  <path class="rail" d="M 640 120 H 700"/>
  <path class="rail" d="M 640 208 H 700"/>
  <path class="rail" d="M 640 296 H 700"/>
  <path class="rail" d="M 640 384 H 700"/>
  <path class="rail" d="M 700 120 V 446" marker-end="url(#arc)"/>
  <text class="sub txt-code" x="712" y="116">every reply</text>
  <text class="sub txt-code" x="712" y="130">comes back</text>
  <text class="sub txt-code" x="712" y="144">this way</text>

  <!-- Authority check (your code decides) -->
  <rect class="code-box" x="300" y="450" width="480" height="70" rx="2"/>
  <text class="box-t txt" x="320" y="476">Your code: authority check</text>
  <text class="sub txt-mute" x="320" y="494">May this agent act, with this party, for this amount?</text>
  <text class="sub txt-code" x="320" y="510">pass, or</text>
  <text class="sub txt-esc" x="363" y="510">refuse</text>

  <!-- Action -->
  <line class="wire" x1="300" y1="485" x2="234" y2="485" marker-end="url(#ar)"/>
  <rect class="soft-box" x="20" y="455" width="210" height="60" rx="6"/>
  <text class="box-t txt" x="125" y="481" text-anchor="middle">Action</text>
  <text class="sub txt-mute" x="125" y="499" text-anchor="middle">only after the check passes</text>

  <!-- Footer -->
  <line class="rule" x1="20" y1="540" x2="780" y2="540"/>
  <text class="foot-t txt" x="24" y="564">A protocol carries the exchange. None of them decides whether your agent may act.</text>
  <rect class="model-box" x="24" y="577" width="22" height="14" rx="6"/>
  <text class="sub txt-mute" x="52" y="588">rounded: the model decides</text>
  <rect class="code-box" x="214" y="577" width="22" height="14" rx="1"/>
  <text class="sub txt-mute" x="242" y="588">rectangle: your code decides</text>
</svg>
