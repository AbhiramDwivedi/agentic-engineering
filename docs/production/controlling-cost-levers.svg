<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 656" width="800" height="656" role="img" aria-labelledby="ttl desc">
<title id="ttl">Controlling cost: four levers on one agent request, all of them your code</title>
<desc id="desc">One agent request: a wide static block (rules, tool schemas, catalog context) and a narrow dynamic one (timestamp, listing). Four code-owned levers act on it. A cache bills the static block cheaply and a batch lane halves the price of waiting work: same quality, lower price. A cascade escalates to a larger model on a failed check, and a budget stops the loop before a step would cross the limit: both judged on cost per passed case.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13px; }
  .card-t { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  .tag-lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .sub { font-size: 12px; }
  .lbl { font-size: 11.5px; font-weight: 600; }
  .mono-t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .code-box, .model-box, .data-box, .lever { stroke-width: 2; }
  .data-box { stroke-dasharray: 5 4; }
  .wire { fill: none; stroke-width: 2; }
  .brace { fill: none; stroke-width: 2; }
  .rule { stroke-width: 1.5; }

  .lever { fill: #f7f8fc; stroke: #4f5b93; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #7e57c2; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .brace { stroke: #4f5b93; }
  .rule { stroke: #c9cfdc; }
  .page-bg { fill: #ffffff; stroke: #e2e6ef; stroke-width: 1; }

  @media (prefers-color-scheme: dark) {
  .lever { fill: #1f2332; stroke: #939ed4; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .data-box { fill: #1b1f29; stroke: #5a6478; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #b39ddb; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .brace { stroke: #939ed4; }
  .rule { stroke: #3a4152; }
  .page-bg { fill: #21222c; stroke: #2b3140; }
  }
</style>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="page-bg" x="0.5" y="0.5" width="799" height="655" rx="8"/>

<text class="h1 txt" x="40" y="38">Four cost levers, and your code pulls every one</text>
<text class="h2 txt-mute" x="40" y="60">One agent request, and the four places your code changes what it costs.</text>

<!-- the request -->
<text class="tag-lbl txt-mute" x="40" y="94">ONE AGENT REQUEST</text>
<rect class="data-box" x="40" y="104" width="520" height="46" rx="4"/>
<text class="lbl txt" x="300" y="124" text-anchor="middle">static: rules &#183; tool schemas &#183; catalog context</text>
<text class="sub txt-mute" x="300" y="141" text-anchor="middle">identical on every call</text>
<rect class="data-box" x="566" y="104" width="194" height="46" rx="4"/>
<text class="lbl txt" x="663" y="124" text-anchor="middle">dynamic: timestamp &#183; listing</text>
<text class="sub txt-mute" x="663" y="141" text-anchor="middle">changes every call</text>
<path class="brace" d="M40,158 V168 H560 V158"/>
<path class="wire" d="M300,168 V210" marker-end="url(#arw)"/>

<!-- same quality, lower price -->
<text class="tag-lbl txt-code" x="40" y="192">SAME QUALITY, LOWER PRICE</text>

<rect class="lever" x="40" y="214" width="350" height="110" rx="4"/>
<text class="card-t txt-code" x="56" y="238">Cache</text>
<text class="sub txt" x="56" y="262">keep the static prefix byte-identical</text>
<text class="sub txt" x="56" y="282">cached prefix billed at about 0.1&#215; input</text>
<text class="sub txt-mute" x="56" y="306">one changed byte and the cache misses</text>

<rect class="lever" x="410" y="214" width="350" height="110" rx="4"/>
<text class="card-t txt-code" x="426" y="238">Batch</text>
<rect class="data-box" x="426" y="252" width="56" height="9" rx="2"/>
<rect class="data-box" x="426" y="266" width="56" height="9" rx="2"/>
<rect class="data-box" x="426" y="280" width="56" height="9" rx="2"/>
<path class="wire" d="M490,270 H514" marker-end="url(#arw)"/>
<text class="lbl txt" x="524" y="265">half-price lane</text>
<text class="sub txt" x="524" y="284">answers within 24 hours</text>
<text class="sub txt-mute" x="426" y="310">a queue of requests that can wait</text>

<!-- divider -->
<line class="rule" x1="40" y1="346" x2="760" y2="346"/>
<text class="tag-lbl txt-code" x="40" y="372">JUDGED ON COST PER PASSED CASE</text>
<text class="sub txt-mute" x="40" y="391">These change the work, so they can cost quality: total eval spend &#247; cases that passed.</text>

<!-- cascade -->
<rect class="lever" x="40" y="406" width="350" height="190" rx="4"/>
<text class="card-t txt-code" x="56" y="430">Cascade</text>
<rect class="model-box" x="56" y="446" width="112" height="36" rx="18"/>
<text class="lbl txt-model" x="112" y="468" text-anchor="middle">small model</text>
<path class="wire" d="M168,464 H186" marker-end="url(#arw)"/>
<rect class="code-box" x="190" y="446" width="120" height="36" rx="4"/>
<text class="lbl txt-code" x="250" y="468" text-anchor="middle">check the answer</text>
<path class="wire" d="M310,464 H328" marker-end="url(#arw)"/>
<text class="lbl txt" x="334" y="460">pass:</text>
<text class="sub txt" x="334" y="476">ship it</text>
<path class="wire" d="M250,482 V518" marker-end="url(#arw)"/>
<text class="lbl txt" x="258" y="505">fail</text>
<rect class="model-box" x="190" y="522" width="120" height="36" rx="18"/>
<text class="lbl txt-model" x="250" y="544" text-anchor="middle">larger model</text>
<text class="sub txt-mute" x="56" y="512">cheap call first;</text>
<text class="sub txt-mute" x="56" y="530">the strong one only</text>
<text class="sub txt-mute" x="56" y="548">on a failed check</text>
<text class="sub txt-mute" x="56" y="580">a fail pays for both calls</text>

<!-- budget -->
<rect class="lever" x="410" y="406" width="350" height="190" rx="4"/>
<text class="card-t txt-code" x="426" y="430">Budget</text>
<text class="sub txt-mute" x="490" y="430">wraps the agent loop</text>
<rect class="model-box" x="426" y="446" width="112" height="36" rx="18"/>
<text class="lbl txt-model" x="482" y="468" text-anchor="middle">agent step</text>
<path class="wire" d="M538,464 H576" marker-end="url(#arw)"/>
<rect class="code-box" x="580" y="446" width="140" height="36" rx="4"/>
<text class="lbl txt-code" x="650" y="468" text-anchor="middle">add up its tokens</text>
<path class="wire" d="M650,482 V506" marker-end="url(#arw)"/>
<rect class="code-box" x="580" y="510" width="140" height="36" rx="4"/>
<text class="lbl txt-code" x="650" y="532" text-anchor="middle">next step over cap?</text>
<path class="wire" d="M580,528 H482 V486" marker-end="url(#arw)"/>
<text class="lbl txt" x="524" y="522">no</text>
<path class="wire" d="M650,546 V562" marker-end="url(#arw)"/>
<text class="lbl txt" x="658" y="558">yes</text>
<text class="mono-t txt" x="582" y="582">stop: budget_exceeded</text>
<text class="sub txt-mute" x="426" y="562">checked before</text>
<text class="sub txt-mute" x="426" y="580">each step</text>

<!-- legend -->
<g transform="translate(40,618)">
<rect class="code-box" x="0" y="0" width="26" height="18" rx="3"/>
<text class="sub txt-mute" x="34" y="13">your code decides</text>
<rect class="model-box" x="170" y="0" width="34" height="18" rx="9"/>
<text class="sub txt-mute" x="212" y="13">the model &#183; answers may vary</text>
<rect class="data-box" x="420" y="0" width="34" height="18" rx="3"/>
<text class="sub txt-mute" x="462" y="13">data in flight, not a decision</text>
</g>
</svg>
