<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-labelledby="ttl desc">
<title id="ttl">The ticket shape: a 30-second lease decides which worker may finish a job</title>
<desc id="desc">Three serving shapes head the drawing: wait, where the answer comes back in the request; watch, where the run streams to the caller; and ticket, where the caller gets a job id now and the result later. The rest follows one ticket job on a timeline in seconds. The job record, kept outside any worker, shows the job running on worker A with attempts at 1, briefly requeued, running on worker B with attempts at 2, then done with its side effect recorded once. Worker A claims the job at t=0 under a 30-second lease. Its model's loop, drawn as the one rounded node, heartbeats at t=25, which renews the lease to t=55. The loop then hangs on a tool call and stops heartbeating, and the lease lapses at t=55. The supervisor sweeps twice: at t=31 the lease is live and there is nothing to reclaim; at t=56 the lease has lapsed and it requeues the job, attempt 1 of 3. Worker B claims it at t=60 as attempt 2, with a lease to t=90, and completes at t=80, recording the side effect once. Worker A wakes at t=61: its heartbeat returns false and its late complete is rejected. A strip at the bottom shows a job that keeps stalling: attempts 1 and 2 lapse and are requeued, and when attempt 3 lapses the job is marked abandoned and not requeued. Every rectangle is your code; only the model's loop inside a worker is the model's.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 19px; font-weight: 700; }
  .h2 { font-size: 12.5px; }
  .tag-lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .lane-t { font-size: 13px; font-weight: 700; }
  .sub { font-size: 11.5px; }
  .sub-b { font-size: 11.5px; font-weight: 700; }
  .seg-t { font-size: 11px; font-weight: 600; }
  .mono-t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .code-box, .model-box, .data-box { stroke-width: 2; }
  .code-box-hi { stroke-width: 3; }
  .data-box { stroke-dasharray: 5 4; }
  .model-hung { fill: none; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .lease { stroke-width: 1; }
  .wire { fill: none; stroke-width: 2; }
  .ghost { fill: none; stroke-dasharray: 4 4; stroke-width: 1.3; }
  .tick { stroke-width: 2; }
  .rule { stroke-width: 1; }

  .code-box, .code-box-hi { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .model-hung { stroke: #7e57c2; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .lease { fill: #dde2f5; stroke: #8f99c6; }
  .seg-run { fill: #c9d0ef; }
  .seg-q { fill: #f1e3c2; }
  .seg-done { fill: #cfe6d6; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5d667a; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #6a43b0; }
  .txt-bad { fill: #a23b3b; }
  .txt-ok { fill: #2e7048; }
  .wire, .tick { stroke: #4f5b93; }  .mk-wire { fill: #4f5b93; }
  .ghost { stroke: #9aa3b8; }
  .rule { stroke: #d5d9e3; }
  .dot-code { fill: #4f5b93; }
  .dot-bad { fill: #a23b3b; }
  .dot-ok { fill: #2e7048; }
  .page-bg { fill: #ffffff; stroke: #e3e6ee; }

  @media (prefers-color-scheme: dark) {
  .code-box, .code-box-hi { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .model-hung { stroke: #b39ddb; }
  .data-box { fill: #1b1f29; stroke: #5a6478; }
  .lease { fill: #2c3350; stroke: #59628c; }
  .seg-run { fill: #3a4370; }
  .seg-q { fill: #5a4a26; }
  .seg-done { fill: #2a4a36; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #c9b6ec; }
  .txt-bad { fill: #ef9a9a; }
  .txt-ok { fill: #8fd3a5; }
  .wire, .tick { stroke: #939ed4; }  .mk-wire { fill: #939ed4; }
  .ghost { stroke: #5a6478; }
  .rule { stroke: #2b3140; }
  .dot-code { fill: #939ed4; }
  .dot-bad { fill: #ef9a9a; }
  .dot-ok { fill: #8fd3a5; }
  .page-bg { fill: #21222c; stroke: #2b3140; }
  }
</style>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="page-bg" x="0.5" y="0.5" width="799" height="609" rx="8"/>

<text class="h1 txt" x="40" y="38">The lease decides which worker may finish the job.</text>
<text class="h2 txt-mute" x="40" y="60">Rectangles are your code. The one rounded node, the model's loop, is the only thing the model decides.</text>

<!-- three serving shapes -->
<rect class="code-box" x="40" y="78" width="226" height="44" rx="6"/>
<text class="sub-b txt" x="54" y="97">Wait</text>
<text class="sub txt-mute" x="54" y="113">answered in the request</text>
<rect class="code-box" x="287" y="78" width="226" height="44" rx="6"/>
<text class="sub-b txt" x="301" y="97">Watch</text>
<text class="sub txt-mute" x="301" y="113">streamed to the caller</text>
<rect class="code-box-hi" x="534" y="78" width="226" height="44" rx="6"/>
<text class="sub-b txt" x="548" y="97">Ticket</text>
<text class="sub txt-mute" x="548" y="113">job id now, result later</text>

<text class="tag-lbl txt-code" x="40" y="152">THE TICKET SHAPE &#183; ONE JOB &#183; 30 S LEASE &#183; TIME IN SECONDS</text>
<line class="rule" x1="40" y1="162" x2="760" y2="162"/>

<!-- lane labels -->
<rect class="data-box" x="40" y="180" width="140" height="48" rx="6"/>
<text class="lane-t txt" x="52" y="200">Job record</text>
<text class="sub txt-mute" x="52" y="217">outside any worker</text>
<rect class="code-box" x="40" y="252" width="140" height="48" rx="6"/>
<text class="lane-t txt" x="52" y="281">Worker A</text>
<rect class="code-box" x="40" y="336" width="140" height="48" rx="6"/>
<text class="lane-t txt" x="52" y="365">Worker B</text>
<rect class="code-box" x="40" y="404" width="140" height="48" rx="6"/>
<text class="lane-t txt" x="52" y="433">Supervisor</text>

<!-- supervisor's requeue reaches the job record -->
<line class="ghost" x1="502" y1="404" x2="502" y2="216"/>

<!-- job record: status bar -->
<text class="seg-t txt-mute" x="513" y="190" text-anchor="middle">requeued</text>
<rect class="seg-run" x="200" y="194" width="302" height="22"/>
<text class="seg-t txt" x="351" y="209" text-anchor="middle">running &#183; worker A</text>
<rect class="seg-q" x="502" y="194" width="22" height="22"/>
<rect class="seg-run" x="524" y="194" width="108" height="22"/>
<text class="seg-t txt" x="578" y="209" text-anchor="middle">running &#183; B</text>
<rect class="seg-done" x="632" y="194" width="68" height="22"/>
<text class="seg-t txt" x="666" y="209" text-anchor="middle">done</text>
<text class="mono-t txt-mute" x="204" y="232">attempts=1</text>
<text class="mono-t txt-mute" x="528" y="232">attempts=2</text>
<text class="mono-t txt-ok" x="636" y="232">effect &#215;1</text>

<!-- worker A -->
<rect class="lease" x="200" y="264" width="297" height="24"/>
<line class="ghost" x1="362" y1="264" x2="362" y2="288"/>
<rect class="model-box" x="204" y="266" width="212" height="20" rx="10"/>
<text class="seg-t txt-model" x="310" y="280" text-anchor="middle">model's loop</text>
<rect class="model-hung" x="418" y="266" width="76" height="20" rx="10"/>
<line class="tick" x1="335" y1="258" x2="335" y2="264"/>
<circle class="dot-code" cx="335" cy="264" r="4"/>
<text class="sub txt-code" x="318" y="252" text-anchor="middle">heartbeat at t=25: lease to 55</text>
<text class="sub txt-mute" x="494" y="304" text-anchor="end">hangs on a tool call, stops heartbeating</text>
<line class="tick" x1="497" y1="258" x2="497" y2="294"/>
<text class="sub txt-bad" x="494" y="252" text-anchor="end">lapses at t=55</text>
<circle class="dot-bad" cx="529" cy="276" r="5"/>
<text class="sub-b txt-bad" x="540" y="266">A wakes at t=61:</text>
<text class="sub txt-bad" x="540" y="281">heartbeat returns False,</text>
<text class="sub txt-bad" x="540" y="296">late complete rejected</text>

<!-- worker B -->
<text class="sub txt-code" x="524" y="340">claims at t=60 as attempt 2, lease to 90</text>
<rect class="lease" x="524" y="348" width="162" height="24"/>
<rect class="model-box" x="528" y="350" width="104" height="20" rx="10"/>
<text class="seg-t txt-model" x="580" y="364" text-anchor="middle">model's loop</text>
<circle class="dot-ok" cx="632" cy="360" r="5"/>
<text class="sub txt-ok" x="528" y="388">complete at t=80: side effect recorded once</text>

<!-- supervisor sweeps -->
<line class="tick" x1="367" y1="410" x2="367" y2="446"/>
<text class="sub txt-mute" x="360" y="424" text-anchor="end">t=31: lease runs to 55,</text>
<text class="sub txt-mute" x="360" y="439" text-anchor="end">nothing to reclaim</text>
<line class="tick" x1="502" y1="410" x2="502" y2="446"/>
<text class="sub-b txt" x="510" y="424">t=56: lease lapsed,</text>
<text class="sub txt" x="510" y="439">job requeued, attempt 1 of 3</text>

<!-- time axis -->
<line class="rule" x1="200" y1="474" x2="710" y2="474"/>
<g class="mono-t txt-mute" text-anchor="middle">
<line class="rule" x1="200" y1="470" x2="200" y2="478"/><text x="200" y="492">0</text>
<line class="rule" x1="335" y1="470" x2="335" y2="478"/><text x="335" y="492">25</text>
<line class="rule" x1="362" y1="470" x2="362" y2="478"/><text x="362" y="492">30</text>
<line class="rule" x1="497" y1="470" x2="497" y2="478"/><text x="497" y="492">55</text>
<line class="rule" x1="524" y1="470" x2="524" y2="478"/><text x="524" y="492">60</text>
<line class="rule" x1="632" y1="470" x2="632" y2="478"/><text x="632" y="492">80</text>
<line class="rule" x1="686" y1="470" x2="686" y2="478"/><text x="686" y="492">90</text>
</g>
<text class="mono-t txt-mute" x="718" y="478">t (s)</text>

<!-- a job that keeps stalling -->
<text class="tag-lbl txt-code" x="40" y="526">IF IT KEEPS STALLING &#183; THREE ATTEMPTS, THEN STOP</text>
<rect class="code-box" x="40" y="540" width="150" height="46" rx="6"/>
<text class="sub-b txt" x="52" y="559">attempt 1</text>
<text class="sub txt-mute" x="52" y="576">lease lapses, requeued</text>
<path class="wire" d="M190,563 L218,563" marker-end="url(#arw)"/>
<rect class="code-box" x="220" y="540" width="150" height="46" rx="6"/>
<text class="sub-b txt" x="232" y="559">attempt 2</text>
<text class="sub txt-mute" x="232" y="576">lease lapses, requeued</text>
<path class="wire" d="M370,563 L398,563" marker-end="url(#arw)"/>
<rect class="code-box" x="400" y="540" width="150" height="46" rx="6"/>
<text class="sub-b txt" x="412" y="559">attempt 3</text>
<text class="sub txt-mute" x="412" y="576">lease lapses</text>
<path class="wire" d="M550,563 L578,563" marker-end="url(#arw)"/>
<rect class="code-box-hi" x="580" y="540" width="180" height="46" rx="6"/>
<text class="sub-b txt-bad" x="594" y="559">abandoned</text>
<text class="sub txt-mute" x="594" y="576">status abandoned, not requeued</text>
</svg>
