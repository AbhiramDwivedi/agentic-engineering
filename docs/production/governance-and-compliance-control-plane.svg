<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="ttl desc">
<title id="ttl">Governance as a control plane: four controls your code owns, read by every regime</title>
<desc id="desc">A large rectangle labelled your code holds four numbered controls, each answering one question. Control 1, the inventory row, answers what the system is and how risky it is: owner, purpose, risk class, provider or deployer role, model, prompt and tools. Inside the same rectangle a rounded model box drafts a bunk-bed listing that carries a guardrail-height claim; that is the only decision the model makes. Its draft goes to control 3, the human override, a publish gate that holds the draft so a merchandiser can cut the claim before it goes live. Then control 4, the disclosure label, is rendered by code and reads "Written with AI, reviewed by a person." The gate writes control 2, the decision record, which answers who decided and with which model and prompt. It shows two lines: rec-000001, the listing agent's publish_listing with prompt listing-copy@v14 and an empty overridden_by, and rec-000002, the merchandiser's correction, which points back at rec-000001. The record is append-only by convention: a correction appends a new line and the original stays as written. The model never writes or sees the record. To the right, four regimes, the EU AI Act, the NIST AI RMF, ISO/IEC 42001 and consumer protection law, each receive an arrow from the control plane: they ask for evidence from the same four controls.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13px; }
  .card-t { font-size: 13px; font-weight: 700; }
  .q { font-size: 12px; font-style: italic; }
  .tag-lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .sub { font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; }
  .num { font-size: 12px; font-weight: 800; }
  .plane, .code-box, .model-box, .data-box { stroke-width: 2; }
  .plane { stroke-width: 2.5; }
  .data-box { stroke-dasharray: 5 4; }
  .wire { fill: none; stroke-width: 2; }
  .rule { stroke-width: 1; }

  .page-bg { fill: #ffffff; stroke: #e2e6ef; stroke-width: 1; }
  .plane { fill: #f7f8fc; stroke: #4f5b93; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .badge { fill: #4f5b93; }
  .badge-t { fill: #eef1f9; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #7e57c2; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .rule { stroke: #d5dae6; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #21222c; stroke: #2b3140; }
  .plane { fill: #1d212e; stroke: #939ed4; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .data-box { fill: #1b1f29; stroke: #5a6478; }
  .badge { fill: #939ed4; }
  .badge-t { fill: #262b3d; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #b39ddb; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .rule { stroke: #353c4e; }
  }
</style>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="page-bg" x="0.5" y="0.5" width="799" height="559" rx="8"/>

<text class="h1 txt" x="24" y="36">Four controls your code owns. Every regime reads from them.</text>
<text class="h2 txt-mute" x="24" y="58">The model drafts the copy. Code holds the answers to the four questions an outside party asks.</text>

<!-- The control plane -->
<rect class="plane" x="20" y="76" width="552" height="420" rx="2"/>
<text class="tag-lbl txt-code" x="36" y="98">YOUR CODE · THE CONTROL PLANE</text>

<!-- 1 Inventory -->
<rect class="code-box" x="36" y="110" width="520" height="66"/>
<circle class="badge" cx="56" cy="130" r="10"/><text class="num badge-t" x="56" y="134.5" text-anchor="middle">1</text>
<text class="card-t txt" x="74" y="135">Inventory row</text>
<text class="q txt-code" x="176" y="135">What is it, and how risky is that use?</text>
<text class="mono txt-mute" x="74" y="161">owner · purpose · risk class · role · model · prompt · tools</text>

<!-- Model -->
<rect class="model-box" x="36" y="200" width="150" height="92" rx="20"/>
<text class="card-t txt-model" x="111" y="226" text-anchor="middle">Model</text>
<text class="sub txt" x="111" y="246" text-anchor="middle">drafts the bunk-bed</text>
<text class="sub txt" x="111" y="262" text-anchor="middle">listing, with a</text>
<text class="sub txt" x="111" y="278" text-anchor="middle">guardrail-height claim</text>

<line class="wire" x1="186" y1="246" x2="206" y2="246" marker-end="url(#arw)"/>

<!-- 3 Override -->
<rect class="code-box" x="208" y="200" width="168" height="92"/>
<circle class="badge" cx="226" cy="219" r="10"/><text class="num badge-t" x="226" y="223.5" text-anchor="middle">3</text>
<text class="card-t txt" x="242" y="224">Human override</text>
<text class="q txt-code" x="220" y="245">Can a person stop it?</text>
<text class="sub txt-mute" x="220" y="264">gate holds the draft;</text>
<text class="sub txt-mute" x="220" y="280">a merchandiser cuts it</text>

<line class="wire" x1="376" y1="246" x2="396" y2="246" marker-end="url(#arw)"/>

<!-- 4 Disclosure -->
<rect class="code-box" x="398" y="200" width="158" height="92"/>
<circle class="badge" cx="416" cy="219" r="10"/><text class="num badge-t" x="416" y="223.5" text-anchor="middle">4</text>
<text class="card-t txt" x="432" y="224">Disclosure label</text>
<text class="q txt-code" x="410" y="245">Does the user know?</text>
<text class="sub txt-mute" x="410" y="264">“Written with AI,</text>
<text class="sub txt-mute" x="410" y="280">reviewed by a person.”</text>

<!-- gate writes the record -->
<line class="wire" x1="292" y1="292" x2="292" y2="326" marker-end="url(#arw)"/>
<text class="sub txt-code" x="302" y="314">code writes each line</text>
<text class="sub txt-model" x="44" y="314">model never writes or sees it</text>

<!-- 2 Decision record -->
<rect class="code-box" x="36" y="328" width="520" height="150"/>
<circle class="badge" cx="56" cy="348" r="10"/><text class="num badge-t" x="56" y="352.5" text-anchor="middle">2</text>
<text class="card-t txt" x="74" y="353">Decision record</text>
<text class="q txt-code" x="190" y="353">Who decided, with which model and prompt?</text>
<line class="rule" x1="52" y1="366" x2="540" y2="366"/>
<text class="mono txt" x="52" y="384">rec-000001  listing-agent  publish_listing</text>
<text class="mono txt-mute" x="132" y="400">model · prompt listing-copy@v14 · overridden_by —</text>
<text class="mono txt" x="52" y="420">rec-000002  merchandiser  corrects rec-000001</text>
<text class="mono txt-mute" x="132" y="436">overridden_by merchandiser</text>
<line class="rule" x1="52" y1="448" x2="540" y2="448"/>
<text class="sub txt-mute" x="52" y="466">Append-only by convention: a correction is a new line; the original stays.</text>

<!-- Regimes -->
<text class="tag-lbl txt-mute" x="600" y="98">THE REGIMES ASK</text>
<text class="sub txt-mute" x="600" y="116">for evidence from</text>
<text class="sub txt-mute" x="600" y="131">the same four controls</text>

<rect class="data-box" x="600" y="146" width="180" height="62" rx="4"/>
<text class="card-t txt" x="612" y="170">EU AI Act</text>
<text class="sub txt-mute" x="612" y="190">Arts. 6, 12, 14, 50</text>

<rect class="data-box" x="600" y="224" width="180" height="62" rx="4"/>
<text class="card-t txt" x="612" y="248">NIST AI RMF</text>
<text class="sub txt-mute" x="612" y="268">GOVERN · MAP · MEASURE</text>
<text class="sub txt-mute" x="612" y="282">· MANAGE</text>

<rect class="data-box" x="600" y="302" width="180" height="62" rx="4"/>
<text class="card-t txt" x="612" y="326">ISO/IEC 42001</text>
<text class="sub txt-mute" x="612" y="346">certifiable AI</text>
<text class="sub txt-mute" x="612" y="360">management system</text>

<rect class="data-box" x="600" y="380" width="180" height="62" rx="4"/>
<text class="card-t txt" x="612" y="404">Consumer protection</text>
<text class="sub txt-mute" x="612" y="424">no AI exemption</text>

<line class="wire" x1="574" y1="177" x2="597" y2="177" marker-end="url(#arw)"/>
<line class="wire" x1="574" y1="255" x2="597" y2="255" marker-end="url(#arw)"/>
<line class="wire" x1="574" y1="333" x2="597" y2="333" marker-end="url(#arw)"/>
<line class="wire" x1="574" y1="411" x2="597" y2="411" marker-end="url(#arw)"/>

<!-- Legend -->
<rect class="model-box" x="24" y="516" width="34" height="22" rx="9"/>
<text class="sub txt-mute" x="66" y="531">the model decides</text>
<rect class="code-box" x="190" y="516" width="34" height="22"/>
<text class="sub txt-mute" x="232" y="531">your code decides</text>
<rect class="data-box" x="356" y="516" width="34" height="22" rx="4"/>
<text class="sub txt-mute" x="398" y="531">an outside party asking for evidence</text>
</svg>
