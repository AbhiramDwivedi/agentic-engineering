<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="ttl desc">
<title id="ttl">Model per step: each step reads its own row, and only a strictly better eval score changes a row</title>
<desc id="desc">Four steps of the Listing Studio pipeline, categorize, write copy, price and polish, each look up their own row in one configuration table, the only place a model ID lives. Categorize and price read openai:gpt-6.2-sol; write copy and polish read anthropic:claude-sonnet-5-5. Below, an eval for the categorize step. A successor shipping, or a retirement notice arriving, starts it. Three cases with known answers, a sit-stand desk, a bunk bed and a phone case, run through the current model A and a candidate C. If they tie, three of three each, the table keeps A, because a tie is not a win. If A scores two of three and C scores three of three, C wins strictly and is written into the categorize row of the table. Every shape is a rectangle: the table, the cases, the comparison and the swap are all your code. The scores are the chapter's three toy cases and say nothing about any real model.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 21px; font-weight: 700; }
  .h2 { font-size: 13.5px; }
  .tag-lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .card-t { font-size: 13px; font-weight: 700; }
  .sub { font-size: 11.5px; }
  .note { font-size: 11px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .score { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
  .code-box, .data-box, .cell { stroke-width: 2; }
  .data-box { stroke-dasharray: 5 4; }
  .cell { stroke-width: 1.3; }
  .lane { fill: none; stroke-width: 1.2; }
  .wire { fill: none; stroke-width: 2; }
  .win { fill: none; stroke-width: 2.4; }
  .pass { stroke-width: 1.6; }
  .fail { stroke-width: 1.6; }

  .page-bg { fill: #ffffff; stroke: #e2e6ef; stroke-width: 1; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .cell { fill: #ffffff; stroke: #4f5b93; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .lane { stroke: #c9cfdc; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .win { stroke: #4f5b93; }   .mk-win { fill: #4f5b93; }
  .pass { fill: #4f5b93; stroke: #4f5b93; }
  .fail { fill: #ffffff; stroke: #4f5b93; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #21222c; stroke: #2b3140; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .cell { fill: #1b1f29; stroke: #939ed4; }
  .data-box { fill: #1b1f29; stroke: #5a6478; }
  .lane { stroke: #3a4153; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .win { stroke: #939ed4; }   .mk-win { fill: #939ed4; }
  .pass { fill: #939ed4; stroke: #939ed4; }
  .fail { fill: #21222c; stroke: #939ed4; }
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arw-win" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-win" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="page-bg" x="0.5" y="0.5" width="799" height="599" rx="8"/>

<text class="h1 txt" x="40" y="40">One model per step, and only an eval may change it.</text>
<text class="h2 txt-mute" x="40" y="63">Each step reads its own row. A candidate takes a row only by beating the current model on that step's cases.</text>

<!-- Pipeline -->
<text class="tag-lbl txt-mute" x="40" y="92">PIPELINE · FOUR OF THE NINE STEPS</text>
<rect class="code-box" x="40" y="102" width="160" height="50" rx="6"/>
<text class="card-t txt" x="120" y="132" text-anchor="middle">categorize</text>
<rect class="code-box" x="230" y="102" width="160" height="50" rx="6"/>
<text class="card-t txt" x="310" y="132" text-anchor="middle">write copy</text>
<rect class="code-box" x="420" y="102" width="160" height="50" rx="6"/>
<text class="card-t txt" x="500" y="132" text-anchor="middle">price</text>
<rect class="code-box" x="610" y="102" width="160" height="50" rx="6"/>
<text class="card-t txt" x="690" y="132" text-anchor="middle">polish</text>
<path class="wire" d="M200,127 H228" marker-end="url(#arw)"/>
<path class="wire" d="M390,127 H418" marker-end="url(#arw)"/>
<path class="wire" d="M580,127 H608" marker-end="url(#arw)"/>

<!-- Lookups -->
<path class="wire" d="M120,152 V182" marker-end="url(#arw)"/>
<path class="wire" d="M310,152 V182" marker-end="url(#arw)"/>
<path class="wire" d="M500,152 V182" marker-end="url(#arw)"/>
<path class="wire" d="M690,152 V182" marker-end="url(#arw)"/>
<text class="note txt-mute" x="128" y="172">looks up its own row</text>

<!-- Configuration table -->
<rect class="code-box" x="30" y="176" width="750" height="104" rx="6"/>
<rect class="cell" x="40" y="184" width="160" height="46" rx="3"/>
<text class="mono txt-code" x="120" y="203" text-anchor="middle">openai:</text>
<text class="mono txt-code" x="120" y="220" text-anchor="middle">gpt-6.2-sol</text>
<rect class="cell" x="230" y="184" width="160" height="46" rx="3"/>
<text class="mono txt-code" x="310" y="203" text-anchor="middle">anthropic:</text>
<text class="mono txt-code" x="310" y="220" text-anchor="middle">claude-sonnet-5-5</text>
<rect class="cell" x="420" y="184" width="160" height="46" rx="3"/>
<text class="mono txt-code" x="500" y="203" text-anchor="middle">openai:</text>
<text class="mono txt-code" x="500" y="220" text-anchor="middle">gpt-6.2-sol</text>
<rect class="cell" x="610" y="184" width="160" height="46" rx="3"/>
<text class="mono txt-code" x="690" y="203" text-anchor="middle">anthropic:</text>
<text class="mono txt-code" x="690" y="220" text-anchor="middle">claude-sonnet-5-5</text>
<text class="card-t txt" x="216" y="256">Configuration table</text>
<text class="sub txt-mute" x="216" y="272">The only place a model ID lives. A step with no row fails loudly.</text>

<!-- Eval -->
<text class="tag-lbl txt-mute" x="40" y="314">EVAL · THE CATEGORIZE STEP</text>
<circle class="pass" cx="566" cy="310" r="5"/>
<text class="note txt-mute" x="576" y="314">case passed</text>
<circle class="fail" cx="666" cy="310" r="5"/>
<text class="note txt-mute" x="676" y="314">case failed</text>

<rect class="data-box" x="40" y="340" width="160" height="66" rx="6"/>
<text class="card-t txt" x="52" y="362">Starts the run</text>
<text class="sub txt-mute" x="52" y="380">a successor ships, or</text>
<text class="sub txt-mute" x="52" y="396">a retirement notice</text>
<path class="wire" d="M200,373 H228" marker-end="url(#arw)"/>

<rect class="code-box" x="230" y="330" width="160" height="186" rx="6"/>
<text class="card-t txt" x="244" y="354">Categorize cases</text>
<text class="sub txt-mute" x="244" y="371">known answers</text>
<rect class="cell" x="244" y="384" width="132" height="30" rx="3"/>
<text class="sub txt" x="256" y="403">sit-stand desk</text>
<rect class="cell" x="244" y="422" width="132" height="30" rx="3"/>
<text class="sub txt" x="256" y="441">bunk bed</text>
<rect class="cell" x="244" y="460" width="132" height="30" rx="3"/>
<text class="sub txt" x="256" y="479">phone case</text>
<path class="wire" d="M390,373 H418" marker-end="url(#arw)"/>
<path class="wire" d="M390,473 H418" marker-end="url(#arw)"/>
<text class="note txt-mute" x="244" y="533">same cases, both models</text>

<!-- Lane 1: tie -->
<rect class="lane" x="420" y="330" width="360" height="86" rx="6"/>
<text class="card-t txt" x="434" y="350">If they tie</text>
<text class="sub txt" x="434" y="376">current A</text>
<circle class="pass" cx="524" cy="372" r="6"/><circle class="pass" cx="542" cy="372" r="6"/><circle class="pass" cx="560" cy="372" r="6"/>
<text class="score txt" x="576" y="377">3/3</text>
<text class="sub txt" x="434" y="402">candidate C</text>
<circle class="pass" cx="524" cy="398" r="6"/><circle class="pass" cx="542" cy="398" r="6"/><circle class="pass" cx="560" cy="398" r="6"/>
<text class="score txt" x="576" y="403">3/3</text>
<rect class="code-box" x="624" y="350" width="146" height="54" rx="6"/>
<text class="card-t txt" x="636" y="372">keep A</text>
<text class="sub txt-mute" x="636" y="391">a tie is not a win</text>

<!-- Lane 2: strict win -->
<rect class="lane" x="420" y="430" width="360" height="86" rx="6"/>
<text class="card-t txt" x="434" y="450">If the candidate wins</text>
<text class="sub txt" x="434" y="476">current A</text>
<circle class="pass" cx="524" cy="472" r="6"/><circle class="pass" cx="542" cy="472" r="6"/><circle class="fail" cx="560" cy="472" r="6"/>
<text class="score txt" x="576" y="477">2/3</text>
<text class="sub txt" x="434" y="502">candidate C</text>
<circle class="pass" cx="524" cy="498" r="6"/><circle class="pass" cx="542" cy="498" r="6"/><circle class="pass" cx="560" cy="498" r="6"/>
<text class="score txt" x="576" y="503">3/3</text>
<rect class="code-box" x="624" y="450" width="146" height="54" rx="6"/>
<text class="card-t txt" x="636" y="472">write C</text>
<text class="sub txt-mute" x="636" y="491">into categorize's row</text>
<path class="win" d="M770,477 H790 V292 H120 V232" marker-end="url(#arw-win)"/>

<text class="sub txt-mute" x="40" y="562">Every shape is a rectangle: the table, the cases, the comparison and the swap are your code.</text>
<text class="note txt-mute" x="40" y="582">Scores are the chapter's three toy cases. They say nothing about any real model.</text>
</svg>
