<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="ttl desc">
<title id="ttl">Observer: every step reports how it ended, and no sink can change the run</title>
<desc id="desc">Three of the run's nine steps drawn as rectangles in a row: step 1 reads the supplier sheet, step 4 writes the description, step 9 publishes. Each step sends events down a one-way arrow: start, then end with an outcome (ok, empty, truncated, refused), or error. Here step 1 ends ok, step 4 ends truncated, and step 9 raises an error, which goes back to the caller. The arrows meet an emit box that fans each event out to three sinks: a user status line, an operator log, and a bounded queue. The user status line is drawn crashed: it raised, emit logged it and skipped it, and the events still reach the other sinks. No arrow leads from any sink back to a step. Every box is a rectangle, because your code decides all of it.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 19px; font-weight: 700; }
  .lane { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .card-t { font-size: 13.5px; font-weight: 700; }
  .sub { font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .code-box { stroke-width: 2; }
  .crash-box { stroke-width: 2; stroke-dasharray: 6 4; }
  .chip { stroke-width: 1.2; }
  .wire { fill: none; stroke-width: 2; }
  .run-wire { fill: none; stroke-width: 2.5; }
  .rule { stroke-width: 1; }

  .page-bg { fill: #ffffff; stroke: #e2e6ef; stroke-width: 1; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .crash-box { fill: #fbf1f1; stroke: #b5525a; }
  .chip { fill: #ffffff; stroke: #aab2c4; }
  .chip-bad { fill: #fbf1f1; stroke: #b5525a; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-bad { fill: #a3434b; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .run-wire { stroke: #4f5b93; }  .mk-run { fill: #4f5b93; }
  .rule { stroke: #e2e6ef; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #161a22; stroke: #2b3140; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .crash-box { fill: #3a2428; stroke: #e0868d; }
  .chip { fill: #1b1f29; stroke: #5a6478; }
  .chip-bad { fill: #3a2428; stroke: #e0868d; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-bad { fill: #f0a3a9; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .run-wire { stroke: #939ed4; }  .mk-run { fill: #939ed4; }
  .rule { stroke: #2b3140; }
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="mk-wire" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="arr-run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="mk-run" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>

<rect class="page-bg" x="0.5" y="0.5" width="799" height="579" rx="10"/>

<text class="h1 txt" x="30" y="36">Every step reports how it ended. No sink can change the run.</text>

<!-- THE RUN -->
<text class="lane txt-mute" x="30" y="70">THE RUN</text>

<rect class="code-box" x="30" y="82" width="170" height="62" rx="2"/>
<text class="card-t txt" x="115" y="108" text-anchor="middle">read supplier sheet</text>
<text class="sub txt-mute" x="115" y="127" text-anchor="middle">step 1</text>

<rect class="code-box" x="240" y="82" width="170" height="62" rx="2"/>
<text class="card-t txt" x="325" y="108" text-anchor="middle">write description</text>
<text class="sub txt-mute" x="325" y="127" text-anchor="middle">step 4 · calls a model</text>

<rect class="code-box" x="450" y="82" width="170" height="62" rx="2"/>
<text class="card-t txt" x="535" y="108" text-anchor="middle">publish</text>
<text class="sub txt-mute" x="535" y="127" text-anchor="middle">step 9</text>

<path class="run-wire" d="M200,113 L236,113" marker-end="url(#arr-run)"/>
<path class="run-wire" d="M410,113 L446,113" marker-end="url(#arr-run)"/>
<path class="run-wire" d="M620,113 L700,113" marker-end="url(#arr-run)"/>
<text class="sub txt-code" x="708" y="108">raises to</text>
<text class="sub txt-code" x="708" y="123">the caller</text>

<!-- EVENTS: one-way arrows down -->
<path class="wire" d="M115,144 L115,296" marker-end="url(#arr)"/>
<path class="wire" d="M325,144 L325,296" marker-end="url(#arr)"/>
<path class="wire" d="M535,144 L535,296" marker-end="url(#arr)"/>

<rect class="chip" x="78" y="172" width="74" height="24" rx="12"/>
<text class="mono txt" x="115" y="188" text-anchor="middle">start</text>
<rect class="chip" x="66" y="222" width="98" height="24" rx="12"/>
<text class="mono txt" x="115" y="238" text-anchor="middle">end · ok</text>

<rect class="chip" x="288" y="172" width="74" height="24" rx="12"/>
<text class="mono txt" x="325" y="188" text-anchor="middle">start</text>
<rect class="chip-bad" x="256" y="222" width="138" height="24" rx="12"/>
<text class="mono txt-bad" x="325" y="238" text-anchor="middle">end · truncated</text>

<rect class="chip" x="498" y="172" width="74" height="24" rx="12"/>
<text class="mono txt" x="535" y="188" text-anchor="middle">start</text>
<rect class="chip-bad" x="498" y="222" width="74" height="24" rx="12"/>
<text class="mono txt-bad" x="535" y="238" text-anchor="middle">error</text>

<!-- outcome key -->
<text class="lane txt-mute" x="650" y="180">END OUTCOME</text>
<text class="mono txt" x="650" y="202">ok</text>
<text class="mono txt" x="650" y="220">empty</text>
<text class="mono txt" x="650" y="238">truncated</text>
<text class="mono txt" x="650" y="256">refused</text>
<text class="sub txt-mute" x="650" y="278">or error, if</text>
<text class="sub txt-mute" x="650" y="293">the step raised</text>

<!-- EMIT -->
<rect class="code-box" x="30" y="300" width="590" height="58" rx="2"/>
<text class="card-t txt" x="325" y="324" text-anchor="middle">emit</text>
<text class="sub txt-mute" x="325" y="344" text-anchor="middle">hands every event to every sink; a sink that raises is logged and skipped</text>

<!-- fan out -->
<path class="wire" d="M115,358 L115,416" marker-end="url(#arr)"/>
<path class="wire" d="M325,358 L325,416" marker-end="url(#arr)"/>
<path class="wire" d="M535,358 L535,416" marker-end="url(#arr)"/>

<!-- SINKS -->
<text class="lane txt-mute" x="650" y="440">SINKS</text>
<text class="sub txt-mute" x="650" y="458">read events,</text>
<text class="sub txt-mute" x="650" y="473">never write back</text>

<rect class="crash-box" x="30" y="420" width="170" height="74" rx="2"/>
<text class="card-t txt" x="115" y="444" text-anchor="middle">user status line</text>
<text class="mono txt-bad" x="115" y="464" text-anchor="middle">✕ raised</text>
<text class="sub txt-bad" x="115" y="482" text-anchor="middle">logged, skipped</text>

<rect class="code-box" x="240" y="420" width="170" height="74" rx="2"/>
<text class="card-t txt" x="325" y="444" text-anchor="middle">operator log</text>
<text class="sub txt-mute" x="325" y="464" text-anchor="middle">ids, durations,</text>
<text class="sub txt-mute" x="325" y="480" text-anchor="middle">error classes</text>

<rect class="code-box" x="450" y="420" width="170" height="74" rx="2"/>
<text class="card-t txt" x="535" y="444" text-anchor="middle">bounded queue</text>
<text class="sub txt-mute" x="535" y="464" text-anchor="middle">drops when full,</text>
<text class="sub txt-mute" x="535" y="480" text-anchor="middle">counts the drops</text>

<!-- footer -->
<line class="rule" x1="30" y1="520" x2="770" y2="520"/>
<text class="sub txt" x="30" y="544">Events flow one way, down. No arrow leads from a sink back to a step, so a crashed sink cannot stop the run.</text>
<rect class="code-box" x="30" y="556" width="22" height="13" rx="1"/>
<text class="sub txt-mute" x="60" y="567">rectangle = your code decides. Every box here is one.</text>
</svg>
