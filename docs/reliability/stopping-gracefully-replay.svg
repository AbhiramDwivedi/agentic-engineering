<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="ttl desc">
<title id="ttl">Checkpointing: the saver skips finished steps, the journal fences the step that was in flight</title>
<desc id="desc">A run drawn twice, before and after a crash. On the first pass, step 6 finishes and your code writes a checkpoint to the saver. Step 7 asks the model, a single rounded node, for the announcement email; your code writes the model's call and its key into the journal, then sends the email to the provider, and the process dies before step 7's checkpoint is written. On the resume, the saver lists step 6 as done, so it is skipped, and step 7 runs again from its start. This time it finds the journal entry, never reaches the model, and resends the recorded email under the same key; the provider answers deduped and the merchant receives one email. Every box that decides what happens on the resume is a rectangle: the saver, the journal, the key. The model is consulted once.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 19px; font-weight: 700; }
  .h2 { font-size: 13px; }
  .lane { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .bt { font-size: 13px; font-weight: 700; }
  .bs { font-size: 11.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .count { font-size: 26px; font-weight: 800; }
  .count-lbl { font-size: 13px; font-weight: 700; }
  .code-box, .model-box, .store-box { stroke-width: 2; }
  .frame { fill: none; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .ghost { stroke-width: 1.5; stroke-dasharray: 5 4; }
  .wire { fill: none; stroke-width: 2; }
  .wire-d { fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .rule { stroke-width: 1.5; stroke-dasharray: 8 6; }
  .x { stroke-width: 2.5; stroke-linecap: round; }

  .page-bg { fill: #ffffff; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .store-box { fill: #e3e7f5; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .ghost { fill: #fbfbfd; stroke: #aab2c4; }
  .frame { stroke: #aab2c4; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #7e57c2; }
  .txt-crash { fill: #b3261e; }
  .wire, .wire-d { stroke: #97a0b5; }
  .mk-wire { fill: #97a0b5; }
  .rule { stroke: #b3261e; }
  .x { stroke: #b3261e; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #161a23; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .store-box { fill: #2e3552; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .ghost { fill: #1b1f29; stroke: #5a6478; }
  .frame { stroke: #5a6478; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #a9b3e6; }
  .txt-model { fill: #c5b2e8; }
  .txt-crash { fill: #f2a19b; }
  .wire, .wire-d { stroke: #78829a; }
  .mk-wire { fill: #78829a; }
  .rule { stroke: #f2a19b; }
  .x { stroke: #f2a19b; }
  }
</style>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<rect class="page-bg" x="0" y="0" width="800" height="640" rx="8"/>

<text class="h1 txt" x="20" y="32">The saver skips finished steps. The journal fences the one in flight.</text>
<text class="h2 txt-mute" x="20" y="54">One launch run, drawn before and after a crash in step 7.</text>

<!-- ============ LANE 1: FIRST PASS ============ -->
<text class="lane txt-mute" x="20" y="84">1 · FIRST PASS</text>

<rect class="code-box" x="20" y="100" width="110" height="56" rx="2"/>
<text class="bt txt" x="75" y="124" text-anchor="middle">Step 6</text>
<text class="bs txt-mute" x="75" y="142" text-anchor="middle">finishes</text>

<rect class="frame" x="146" y="92" width="634" height="72" rx="4"/>
<text class="bs txt-mute" x="156" y="88">step 7</text>

<rect class="model-box" x="158" y="100" width="150" height="56" rx="26"/>
<text class="bt txt-model" x="233" y="124" text-anchor="middle">Model writes</text>
<text class="bs txt-model" x="233" y="142" text-anchor="middle">the announcement</text>

<path class="wire" d="M308,128 L326,128" marker-end="url(#arw)"/>
<rect class="code-box" x="328" y="100" width="150" height="56" rx="2"/>
<text class="bt txt" x="403" y="124" text-anchor="middle">Journal the call</text>
<text class="bs txt-mute" x="403" y="142" text-anchor="middle">and its key, first</text>

<path class="wire" d="M478,128 L496,128" marker-end="url(#arw)"/>
<rect class="code-box" x="498" y="100" width="130" height="56" rx="2"/>
<text class="bt txt" x="563" y="124" text-anchor="middle">Send email</text>
<text class="bs txt-mute" x="563" y="142" text-anchor="middle">with the key</text>

<path class="wire" d="M628,128 L646,128" marker-end="url(#arw)"/>
<rect class="code-box" x="648" y="100" width="122" height="56" rx="2"/>
<text class="bt txt" x="709" y="124" text-anchor="middle">Provider</text>
<text class="mono txt-code" x="709" y="142" text-anchor="middle">done</text>

<!-- the missing checkpoint -->
<rect class="ghost" x="560" y="174" width="210" height="38" rx="2"/>
<line class="x" x1="572" y1="185" x2="584" y2="201"/>
<line class="x" x1="584" y1="185" x2="572" y2="201"/>
<text class="bs txt-crash" x="594" y="190" font-weight="700">process dies here</text>
<text class="bs txt-mute" x="594" y="205">step 7 checkpoint never written</text>

<!-- writes down into the stores -->
<path class="wire" d="M75,156 L75,236" marker-end="url(#arw)"/>
<text class="bs txt-code" x="83" y="200">checkpoint</text>
<path class="wire" d="M403,156 L403,236" marker-end="url(#arw)"/>
<text class="bs txt-code" x="411" y="200">written before the send</text>

<!-- ============ DURABLE STORES ============ -->
<rect class="store-box" x="20" y="238" width="250" height="58" rx="2"/>
<text class="bt txt" x="34" y="261">Saver</text>
<text class="bs txt-mute" x="80" y="261">checkpoints</text>
<text class="mono txt-code" x="34" y="282">done: … step 6</text>

<rect class="store-box" x="290" y="238" width="490" height="58" rx="2"/>
<text class="bt txt" x="304" y="261">Journal</text>
<text class="bs txt-mute" x="362" y="261">survives the crash</text>
<text class="mono txt-code" x="304" y="282">step 7 → recorded email + key (run id : step 7)</text>

<!-- crash divider -->
<line class="rule" x1="20" y1="322" x2="780" y2="322"/>
<rect class="page-bg" x="270" y="312" width="260" height="20"/>
<text class="bs txt-crash" x="400" y="326" text-anchor="middle" font-weight="700">restart, same run id</text>

<!-- ============ LANE 2: RESUME ============ -->
<text class="lane txt-mute" x="20" y="356">2 · RESUME</text>

<!-- reads up from the stores -->
<path class="wire" d="M75,296 L75,370" marker-end="url(#arw)"/>
<path class="wire" d="M302,296 L302,370" marker-end="url(#arw)"/>

<rect class="ghost" x="20" y="372" width="110" height="56" rx="2"/>
<text class="bt txt-mute" x="75" y="396" text-anchor="middle">Step 6</text>
<text class="bs txt-mute" x="75" y="414" text-anchor="middle">skipped</text>

<rect class="frame" x="146" y="364" width="634" height="138" rx="4"/>
<text class="bs txt-mute" x="430" y="358">step 7 runs again from its start</text>

<rect class="code-box" x="158" y="372" width="160" height="56" rx="2"/>
<text class="bt txt" x="238" y="396" text-anchor="middle">Check the journal</text>
<text class="bs txt-mute" x="238" y="414" text-anchor="middle">entry found</text>

<path class="wire" d="M318,400 L336,400" marker-end="url(#arw)"/>
<rect class="code-box" x="338" y="372" width="170" height="56" rx="2"/>
<text class="bt txt" x="423" y="396" text-anchor="middle">Resend recorded email</text>
<text class="bs txt-mute" x="423" y="414" text-anchor="middle">under the same key</text>

<path class="wire" d="M508,400 L526,400" marker-end="url(#arw)"/>
<rect class="code-box" x="528" y="372" width="110" height="56" rx="2"/>
<text class="bt txt" x="583" y="396" text-anchor="middle">Provider</text>
<text class="mono txt-code" x="583" y="414" text-anchor="middle">deduped</text>

<path class="wire" d="M638,400 L656,400" marker-end="url(#arw)"/>
<rect class="code-box" x="658" y="372" width="112" height="56" rx="2"/>
<text class="bt txt" x="714" y="396" text-anchor="middle">Merchant</text>
<text class="bs txt-mute" x="714" y="414" text-anchor="middle">gets one email</text>

<!-- the model, not reached -->
<path class="wire-d" d="M238,428 L238,456"/>
<line class="x" x1="231" y1="436" x2="245" y2="450"/>
<line class="x" x1="245" y1="436" x2="231" y2="450"/>
<rect class="ghost" x="158" y="458" width="160" height="36" rx="18"/>
<text class="bs txt-mute" x="238" y="481" text-anchor="middle">Model: not asked</text>
<text class="bs txt-mute" x="330" y="481">the replay never reaches the model, so the wording cannot change</text>

<!-- ============ TALLY + LEGEND ============ -->
<text class="count txt-model" x="20" y="556">1</text>
<text class="count-lbl txt" x="42" y="553">model call</text>
<text class="count txt-code" x="150" y="556">1</text>
<text class="count-lbl txt" x="172" y="553">email received</text>
<text class="bs txt-mute" x="300" y="553">Saver, journal and key decide the resume. All three are your code.</text>

<rect class="model-box" x="20" y="586" width="46" height="24" rx="12"/>
<text class="bs txt-mute" x="74" y="603">rounded: the model decides</text>
<rect class="code-box" x="250" y="586" width="46" height="24" rx="2"/>
<text class="bs txt-mute" x="304" y="603">rectangle: your code decides</text>
<rect class="ghost" x="490" y="586" width="46" height="24" rx="2"/>
<text class="bs txt-mute" x="544" y="603">dashed: not run</text>
</svg>
