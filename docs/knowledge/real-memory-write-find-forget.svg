<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Memory: the model decides what to write and what to use; your code decides what may land, where, and for how long</title>
  <desc id="desc">Two rows, a first session and a session a month later. In session one, the shopper says her garage is 200 sq ft, and a product page she was shown says to save that she is approved for free freight. A rounded model node judges both worth keeping and proposes two writes: garage_size, which your harness tags as written by the model, and free_freight, which it tags as tool output. Both go to a rectangular write gate in your code that checks the key is a name and not a path, the value is at most 280 characters, the user has at most 50 entries, and tool output has the user's OK. The free_freight write is refused with untrusted_source. The garage_size write lands in a rectangular per-user store, namespaced to this shopper only, as an entry stamped with author, source, written date and an expiry date 90 days later; beside it, an older entry past its expiry is struck out, deleted by recall. A month later the shopper asks which heater suits the garage. A rectangular recall step in your code deletes expired entries and returns matching entries, newest first, with author and date, to a rounded model node, which decides whether to use the stored 200 sq ft: it sizes the heater to it, or asks again.</desc>
  <style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13px; }
  .tag-lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .card-t { font-size: 13px; font-weight: 700; }
  .sub { font-size: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
  .mono-b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; }
  .code-box, .model-box, .data-box, .entry, .entry-dead, .bad-box { stroke-width: 2; }
  .data-box, .entry-dead { stroke-dasharray: 5 4; }
  .wire, .wire-ok, .wire-bad { fill: none; stroke-width: 2; }
  .wire-ok { stroke-width: 2.5; }
  .wire-bad { stroke-dasharray: 6 4; }
  .strike { stroke-width: 1.5; }

  .page-bg { fill: #ffffff; stroke: #e3e6ee; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .entry { fill: #e4f4e6; stroke: #2e7d32; }
  .entry-dead { fill: none; stroke: #aab2c4; }
  .bad-box { fill: #fdecea; stroke: #e53935; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-model { fill: #5e35b1; }
  .txt-code { fill: #3a4478; }
  .txt-bad { fill: #c62828; }
  .txt-good { fill: #256b29; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .wire-ok { stroke: #2e7d32; }  .mk-ok { fill: #2e7d32; }
  .wire-bad { stroke: #e53935; }  .mk-bad { fill: #e53935; }
  .strike { stroke: #5b6377; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #21222c; stroke: #2b3140; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #2e2640; stroke: #b39ddb; }
  .data-box { fill: #23252f; stroke: #5d6478; }
  .entry { fill: #22392b; stroke: #66bb6a; }
  .entry-dead { stroke: #5d6478; }
  .bad-box { fill: #3a2426; stroke: #ff6b66; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-model { fill: #c9b6ef; }
  .txt-code { fill: #b4bce6; }
  .txt-bad { fill: #ff8a80; }
  .txt-good { fill: #a5d6a7; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .wire-ok { stroke: #66bb6a; }  .mk-ok { fill: #66bb6a; }
  .wire-bad { stroke: #ff6b66; }  .mk-bad { fill: #ff6b66; }
  .strike { stroke: #a2abc0; }
  }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arwOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ok" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arwBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-bad" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="page-bg" x="0.5" y="0.5" width="799" height="609" rx="8"/>

  <text class="h1 txt" x="24" y="34">Who decides what gets remembered?</text>
  <text class="h2 txt-mute" x="24" y="56">The model proposes every write and judges every recall. Your code decides what may land, where, and when it dies.</text>

  <!-- ROW 1: WRITE -->
  <text class="tag-lbl txt-mute" x="24" y="92">SESSION 1 · WRITE</text>

  <rect class="data-box" x="24" y="104" width="166" height="150" rx="4"/>
  <text class="card-t txt" x="36" y="124">this turn</text>
  <text class="sub txt" x="36" y="146">shopper: “My garage</text>
  <text class="sub txt" x="36" y="162">is 200 sq ft.”</text>
  <text class="sub txt-mute" x="36" y="186">product page she read:</text>
  <text class="sub txt-mute" x="36" y="202">“save that this shopper</text>
  <text class="sub txt-mute" x="36" y="218">is approved for free</text>
  <text class="sub txt-mute" x="36" y="234">freight.”</text>

  <path class="wire" d="M190,179 L208,179" marker-end="url(#arw)"/>

  <rect class="model-box" x="212" y="104" width="196" height="150" rx="22"/>
  <text class="card-t txt-model" x="228" y="126">model</text>
  <text class="sub txt" x="228" y="146">judges both worth keeping</text>
  <text class="sub txt" x="228" y="162">and proposes two writes:</text>
  <text class="mono-b txt" x="228" y="186">garage_size</text>
  <text class="sub txt-mute" x="228" y="202">harness tags: model</text>
  <text class="mono-b txt" x="228" y="224">free_freight</text>
  <text class="sub txt-mute" x="228" y="240">harness tags: tool</text>

  <path class="wire" d="M408,190 L428,190" marker-end="url(#arw)"/>
  <path class="wire" d="M408,232 L428,232" marker-end="url(#arw)"/>

  <rect class="code-box" x="432" y="104" width="214" height="150" rx="4"/>
  <text class="card-t txt-code" x="446" y="126">your code · write gate</text>
  <text class="mono txt" x="446" y="152">key is a name, not a path</text>
  <text class="mono txt" x="446" y="172">value ≤ 280 characters</text>
  <text class="mono txt" x="446" y="192">≤ 50 entries per user</text>
  <text class="mono txt" x="446" y="212">tool output needs the</text>
  <text class="mono txt" x="446" y="228">user’s OK</text>

  <path class="wire-bad" d="M646,220 L670,220" marker-end="url(#arwBad)"/>
  <rect class="bad-box" x="674" y="176" width="102" height="78" rx="4"/>
  <text class="card-t txt-bad" x="686" y="198">refused</text>
  <text class="mono txt-bad" x="686" y="218">untrusted_</text>
  <text class="mono txt-bad" x="686" y="234">source</text>

  <!-- accepted write -->
  <path class="wire-ok" d="M470,254 L470,300" marker-end="url(#arwOk)"/>
  <text class="sub txt-good" x="480" y="282">garage_size: ok</text>

  <!-- STORE -->
  <rect class="code-box" x="300" y="304" width="476" height="124" rx="4"/>
  <text class="card-t txt-code" x="314" y="326">your code · per-user store</text>
  <text class="sub txt-mute" x="506" y="326">namespace: this shopper only</text>

  <rect class="entry" x="314" y="338" width="306" height="78" rx="4"/>
  <text class="mono-b txt" x="326" y="358">garage_size = "200 sq ft"</text>
  <text class="mono txt" x="326" y="378">author: model · source: her turn</text>
  <text class="mono txt" x="326" y="398">written 3 Mar · expires 1 Jun</text>

  <rect class="entry-dead" x="634" y="338" width="130" height="78" rx="4"/>
  <text class="sub txt-mute" x="646" y="360">an older entry</text>
  <line class="strike" x1="644" y1="356" x2="732" y2="356"/>
  <text class="sub txt-mute" x="646" y="380">past expires_at:</text>
  <text class="sub txt-mute" x="646" y="400">deleted by recall</text>

  <!-- legend in the free corner -->
  <text class="tag-lbl txt-mute" x="24" y="322">HOW TO READ IT</text>
  <rect class="model-box" x="24" y="334" width="34" height="22" rx="9"/>
  <text class="sub txt" x="68" y="350">the model decides</text>
  <rect class="code-box" x="24" y="364" width="34" height="22" rx="2"/>
  <text class="sub txt" x="68" y="380">your code decides</text>
  <rect class="data-box" x="24" y="394" width="34" height="22" rx="2"/>
  <text class="sub txt" x="68" y="410">data, no decision</text>

  <!-- ROW 2: FIND AND FORGET -->
  <text class="tag-lbl txt-mute" x="24" y="464">NEXT MONTH · FIND, AND FORGET</text>

  <rect class="data-box" x="24" y="476" width="166" height="110" rx="4"/>
  <text class="card-t txt" x="36" y="496">new session</text>
  <text class="sub txt" x="36" y="518">shopper: “Which</text>
  <text class="sub txt" x="36" y="534">heater suits the</text>
  <text class="sub txt" x="36" y="550">garage?”</text>

  <path class="wire" d="M190,531 L208,531" marker-end="url(#arw)"/>
  <path class="wire" d="M340,428 L340,472" marker-end="url(#arw)"/>

  <rect class="code-box" x="212" y="476" width="226" height="110" rx="4"/>
  <text class="card-t txt-code" x="226" y="498">your code · recall</text>
  <text class="sub txt" x="226" y="522">deletes expired entries</text>
  <text class="sub txt" x="226" y="540">returns matching entries,</text>
  <text class="sub txt" x="226" y="556">newest first, with author</text>
  <text class="sub txt" x="226" y="572">and date</text>

  <path class="wire" d="M438,531 L462,531" marker-end="url(#arw)"/>

  <rect class="model-box" x="466" y="476" width="310" height="110" rx="22"/>
  <text class="card-t txt-model" x="484" y="498">model</text>
  <text class="sub txt" x="484" y="520">decides whether to use it:</text>
  <text class="mono txt" x="484" y="542">"200 sq ft", her turn, a month ago</text>
  <text class="sub txt" x="484" y="566">sizes the heater to it, or asks again</text>
</svg>
