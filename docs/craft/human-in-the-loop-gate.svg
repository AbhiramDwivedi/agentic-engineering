<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" aria-labelledby="ttl desc">
<title id="ttl">Your code decides when to ask a person, and the approval is bound to the exact action</title>
<desc id="desc">The pricing step for the Aldsworth standing desk, whose MAP floor is 39900 cents. A rounded model box proposes set_price for the desk at 41000. A rectangle for your code sorts the proposed price into three bands on a price line, and the model never decides whether it needs permission. Below 39900 the price is refused by code: no person is asked, because the price breaks the supplier agreement, and nothing is written. At 42900 and above it is applied by code with no person in the path. The proposed 41000 lands in the middle band, 39900 to 42899, so code saves the pending request, set_price at 41000 with a digest, a hash of that exact name and arguments, and stops. A merchandiser, who is never the requester, sees the exact action and can approve, reject with a reason that goes back to the model, or edit the price. On resume, code checks that the digest still matches the action and re-bands any edit before the single write. An altered or stale action, whose digest differs, is refused with no write, and an edit to 39899 is refused as below the floor while the request stays pending. Otherwise the price is applied once, 41000 is written, and a repeat resume writes nothing. A legend notes that the rounded shape is where the model decides, rectangles are where your code decides, and the figure marks where a person decides.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13.5px; }
  .card-t { font-size: 13px; font-weight: 700; }
  .sub { font-size: 11.5px; }
  .band-t { font-size: 11.5px; font-weight: 700; }
  .num { font-size: 12px; font-weight: 700; }
  .mono-s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
  .code-box, .model-box, .person-box { stroke-width: 2; }
  .wire { fill: none; stroke-width: 2; }
  .tick { stroke-width: 1.5; }
  .pin { stroke-width: 2.5; }
  .chip { stroke-width: 1.5; }

  .page-bg { fill: #ffffff; stroke: #e2e6ef; stroke-width: 1; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .bad-box { fill: #fbf1f0; stroke: #b3423a; }
  .ok-box { fill: #f0f8f3; stroke: #2e7d4f; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .person-box { fill: #fdf7ec; stroke: #9a6a1f; }
  .chip { fill: #ffffff; stroke: #9a6a1f; }
  .person-glyph { fill: #9a6a1f; }
  .seg-deny { fill: #f2d9d6; }
  .seg-ask { fill: #dfe4f5; }
  .seg-auto { fill: #d8eee0; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #7e57c2; }
  .txt-person { fill: #7a5214; }
  .txt-bad { fill: #b3423a; }
  .txt-ok { fill: #2e7d4f; }
  .wire, .tick { stroke: #97a0b5; }
  .pin { stroke: #1f2430; }
  .mk-wire { fill: #97a0b5; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #161a22; stroke: #2b3140; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .bad-box { fill: #2e1f22; stroke: #ef8a80; }
  .ok-box { fill: #1b2a22; stroke: #7bc79a; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .person-box { fill: #2d261b; stroke: #d6a75a; }
  .chip { fill: #1b1f29; stroke: #d6a75a; }
  .person-glyph { fill: #d6a75a; }
  .seg-deny { fill: #4a2b2e; }
  .seg-ask { fill: #323a5c; }
  .seg-auto { fill: #1f3a2a; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #b39ddb; }
  .txt-person { fill: #e3bb78; }
  .txt-bad { fill: #ef8a80; }
  .txt-ok { fill: #7bc79a; }
  .wire, .tick { stroke: #78829a; }
  .pin { stroke: #e6e8ee; }
  .mk-wire { fill: #78829a; }
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="mk-wire"/>
  </marker>
</defs>

<rect class="page-bg" x="0.5" y="0.5" width="799" height="649" rx="10"/>

<text class="h1 txt" x="40" y="36">Your code decides when to ask; the approval binds the exact action</text>
<text class="h2 txt-mute" x="40" y="58">Pricing the Aldsworth standing desk. MAP floor: 39900 cents.</text>

<!-- the model proposes -->
<rect class="model-box" x="230" y="74" width="340" height="52" rx="26"/>
<text class="card-t txt-model" x="400" y="95" text-anchor="middle">The model proposes a price</text>
<text class="mono-s txt" x="400" y="114" text-anchor="middle">set_price(Aldsworth desk, 41000)</text>
<path class="wire" d="M400,126 L400,144" marker-end="url(#arw)"/>

<!-- the gate in code -->
<rect class="code-box" x="40" y="146" width="720" height="104" rx="4"/>
<text class="card-t txt-code" x="60" y="168">Your code sorts the proposed price into a band</text>
<text class="sub txt-mute" x="740" y="168" text-anchor="end">The model never decides whether it needs permission.</text>
<rect class="seg-deny" x="70" y="186" width="190" height="24"/>
<rect class="seg-ask" x="260" y="186" width="280" height="24"/>
<rect class="seg-auto" x="540" y="186" width="190" height="24"/>
<text class="band-t txt-bad" x="165" y="202" text-anchor="middle">refuse</text>
<text class="band-t txt-code" x="455" y="202" text-anchor="middle">ask a person</text>
<text class="band-t txt-ok" x="635" y="202" text-anchor="middle">apply</text>
<line class="tick" x1="260" y1="182" x2="260" y2="216"/>
<line class="tick" x1="540" y1="182" x2="540" y2="216"/>
<line class="pin" x1="363" y1="180" x2="363" y2="216"/>
<text class="num txt-mute" x="260" y="234" text-anchor="middle">39900</text>
<text class="num txt" x="363" y="234" text-anchor="middle">41000 proposed</text>
<text class="num txt-mute" x="540" y="234" text-anchor="middle">42900</text>

<path class="wire" d="M165,250 L140,278" marker-end="url(#arw)"/>
<path class="wire" d="M400,250 L400,278" marker-end="url(#arw)"/>
<path class="wire" d="M635,250 L660,278" marker-end="url(#arw)"/>

<!-- left: refused by code -->
<rect class="bad-box" x="40" y="280" width="190" height="120" rx="4" stroke-width="2"/>
<text class="card-t txt-bad" x="54" y="302">Below 39900</text>
<text class="sub txt" x="54" y="322">Refused by code.</text>
<text class="sub txt" x="54" y="340">No person is asked: the</text>
<text class="sub txt" x="54" y="356">price breaks the supplier</text>
<text class="sub txt" x="54" y="372">agreement.</text>
<text class="sub txt-mute" x="54" y="390">Nothing is written.</text>

<!-- right: applied by code -->
<rect class="ok-box" x="570" y="280" width="190" height="120" rx="4" stroke-width="2"/>
<text class="card-t txt-ok" x="584" y="302">42900 and above</text>
<text class="sub txt" x="584" y="322">Applied by code.</text>
<text class="sub txt" x="584" y="340">No person in the path.</text>
<text class="sub txt-mute" x="584" y="358">The price is written.</text>

<!-- middle: pause -->
<rect class="code-box" x="250" y="280" width="300" height="86" rx="4"/>
<text class="card-t txt-code" x="264" y="300">39900 to 42899: pause</text>
<text class="sub txt" x="264" y="318">Code saves the pending request, then stops:</text>
<text class="mono-s txt" x="264" y="337">set_price, 41000, digest</text>
<text class="sub txt-mute" x="264" y="355">digest = hash of that exact name and arguments</text>
<path class="wire" d="M400,366 L400,380" marker-end="url(#arw)"/>

<!-- the person -->
<rect class="person-box" x="250" y="382" width="300" height="96" rx="4"/>
<circle class="person-glyph" cx="272" cy="396" r="6"/>
<path class="person-glyph" d="M262,412 Q272,400 282,412 Z"/>
<text class="card-t txt-person" x="292" y="402">Merchandiser (never the requester)</text>
<text class="sub txt" x="292" y="419">sees the exact action: set_price, 41000</text>
<rect class="chip" x="262" y="428" width="80" height="24" rx="3"/>
<rect class="chip" x="350" y="428" width="106" height="24" rx="3"/>
<rect class="chip" x="464" y="428" width="76" height="24" rx="3"/>
<text class="band-t txt-person" x="302" y="444" text-anchor="middle">Approve</text>
<text class="band-t txt-person" x="403" y="444" text-anchor="middle">Reject + reason</text>
<text class="band-t txt-person" x="502" y="444" text-anchor="middle">Edit price</text>
<text class="sub txt-mute" x="262" y="470">A rejection reason goes back to the model.</text>
<path class="wire" d="M400,478 L400,492" marker-end="url(#arw)"/>

<!-- resume check -->
<rect class="code-box" x="250" y="494" width="300" height="72" rx="4"/>
<text class="card-t txt-code" x="264" y="514">On resume, code checks again</text>
<text class="sub txt" x="264" y="533">Does the digest still match the action?</text>
<text class="sub txt" x="264" y="551">Re-band any edit before the single write.</text>
<path class="wire" d="M250,530 L232,530" marker-end="url(#arw)"/>
<path class="wire" d="M550,530 L568,530" marker-end="url(#arw)"/>

<!-- refused at resume -->
<rect class="bad-box" x="40" y="494" width="190" height="102" rx="4" stroke-width="2"/>
<text class="card-t txt-bad" x="54" y="514">Refused at resume</text>
<text class="sub txt" x="54" y="533">Altered or stale action:</text>
<text class="sub txt" x="54" y="549">digest differs, no write.</text>
<text class="sub txt" x="54" y="568">Edit to 39899: below the</text>
<text class="sub txt" x="54" y="584">floor, stays pending.</text>

<!-- applied once -->
<rect class="ok-box" x="570" y="494" width="190" height="102" rx="4" stroke-width="2"/>
<text class="card-t txt-ok" x="584" y="514">Applied once</text>
<text class="sub txt" x="584" y="533">41000 is written.</text>
<text class="sub txt" x="584" y="552">A repeat resume</text>
<text class="sub txt" x="584" y="568">writes nothing.</text>

<!-- legend -->
<rect class="model-box" x="40" y="614" width="34" height="18" rx="9"/>
<text class="sub txt-mute" x="82" y="627">the model decides</text>
<rect class="code-box" x="220" y="614" width="34" height="18" rx="2"/>
<text class="sub txt-mute" x="262" y="627">your code decides</text>
<circle class="person-glyph" cx="412" cy="617" r="4.5"/>
<path class="person-glyph" d="M404,630 Q412,620 420,630 Z"/>
<text class="sub txt-mute" x="430" y="627">a person decides</text>
</svg>
