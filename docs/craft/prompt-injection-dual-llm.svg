<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 644" width="800" height="644" role="img" aria-labelledby="ttl desc">
<title id="ttl">Dual LLM: untrusted text is read where nothing can act, and code rules on every action</title>
<desc id="desc">A supplier's spec sheet for the Aldsworth desk carries real fields and a planted line telling the model to set the price to 19900 and email cost data out. The sheet goes only to a quarantined reader, a model with no tools: it may obey the planted line, but it has nothing to act with. Its output must pass a schema check in code that accepts typed fields alone: width and depth as integers, materials and certifications from fixed lists, and a note capped at 120 characters that goes to a human and never into a prompt. Any extra key is rejected, so when the planted line makes the reader add a set_price key, the output stops at the schema with a validation error. Only a validated record crosses the trust boundary. On the privileged side, code builds the prompt from those typed fields, a planner model proposes actions, and a guard in code decides. The guard refuses set_price at 19900 because it is below the MAP floor of 39900, refuses a send_email whose payload carries cost_cents because that field may not leave, and lets set_price at 44900 and a publish with allowed fields through to the tools. A caveat notes the channel is narrowed, not closed: the egress check reads field names, never recipients, so an allowed field such as description can still carry a smuggled string.</desc>
<style>
