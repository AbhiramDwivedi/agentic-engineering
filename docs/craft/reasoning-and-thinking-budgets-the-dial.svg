<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="ttl desc">
<title id="ttl">The thinking budget: your code sets the envelope, the model decides how much of it to think</title>
<desc id="desc">Your code sets an effort level, none, low, medium or high, and an output cap. Inside that budget the model decides how much to think: it produces hidden thinking tokens and then the visible answer, and both run up against the same output cap. Both add up to one billed output-token count. Below, the chapter's scripted sweep, with invented numbers: the same two cases and grader at every level. none bills 120 tokens and scores 0.50; low bills 1,920 and still scores 0.50; medium bills 6,420 and scores 1.00, so it is shipped; high bills 15,120 and falls back to 0.50 because it overthinks the easy case. The chosen level goes back into the configuration.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 18px; font-weight: 700; }
  .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; }
  .lbl { font-size: 13px; }
  .lbl-b { font-size: 13px; font-weight: 700; }
  .sub { font-size: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .code-box, .model-box, .data-box { stroke-width: 2; }
  .data-box { stroke-dasharray: 5 4; }
  .wire { fill: none; stroke-width: 2; }
  .cap { fill: none; stroke-width: 2; stroke-dasharray: 5 4; }
  .track { stroke-width: 1.5; stroke-dasharray: 4 4; }

  .page-bg { fill: #ffffff; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .seg { fill: #ffffff; stroke: #4f5b93; stroke-width: 1.5; }
  .seg-on { fill: #4f5b93; stroke: #4f5b93; stroke-width: 1.5; }
  .seg-on-t { fill: #ffffff; }
  .track { fill: #ffffff; stroke: #aab2c4; }
  .think { fill: #e3d4f7; stroke: #7e57c2; stroke-width: 1.5; }
  .answer { fill: #9f7ee0; stroke: #7e57c2; stroke-width: 1.5; }
  .answer-t { fill: #ffffff; }
  .qual { fill: #c5cbe6; stroke: #4f5b93; stroke-width: 1.2; }
  .pick { fill: none; stroke: #4f5b93; stroke-width: 2; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #7e57c2; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .cap { stroke: #4f5b93; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #1b1f29; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .data-box { fill: #1b1f29; stroke: #5a6478; }
  .seg { fill: #1b1f29; stroke: #939ed4; }
  .seg-on { fill: #939ed4; stroke: #939ed4; }
  .seg-on-t { fill: #1b1f29; }
  .track { fill: #1b1f29; stroke: #5a6478; }
  .think { fill: #4a3b6b; stroke: #b39ddb; }
  .answer { fill: #b39ddb; stroke: #b39ddb; }
  .answer-t { fill: #1b1f29; }
  .qual { fill: #4a5378; stroke: #939ed4; }
  .pick { stroke: #939ed4; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #b39ddb; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .cap { stroke: #939ed4; }
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" class="mk-wire"/>
  </marker>
</defs>

<rect class="page-bg" x="0" y="0" width="800" height="560"/>

<!-- Title and legend -->
<text class="h1 txt" x="20" y="32">Your code sets the envelope; the model decides how much of it to think</text>
<rect class="code-box" x="20" y="48" width="22" height="14"/>
<text class="sub txt-mute" x="50" y="60">rectangle: your code decides</text>
<rect class="model-box" x="230" y="48" width="22" height="14" rx="7"/>
<text class="sub txt-mute" x="260" y="60">rounded: the model decides</text>

<!-- Your code: the envelope -->
<rect class="code-box" x="20" y="84" width="230" height="160"/>
<text class="tag txt-code" x="36" y="108">YOUR CODE SETS</text>
<text class="lbl txt" x="36" y="136">effort level</text>
<rect class="seg" x="36" y="146" width="50" height="26"/>
<rect class="seg" x="86" y="146" width="50" height="26"/>
<rect class="seg-on" x="136" y="146" width="50" height="26"/>
<rect class="seg" x="186" y="146" width="50" height="26"/>
<text class="sub txt-code" x="61" y="163" text-anchor="middle">none</text>
<text class="sub txt-code" x="111" y="163" text-anchor="middle">low</text>
<text class="sub seg-on-t" x="161" y="163" text-anchor="middle" font-weight="700">medium</text>
<text class="sub txt-code" x="211" y="163" text-anchor="middle">high</text>
<text class="lbl txt" x="36" y="200">output cap</text>
<text class="mono txt-mute" x="36" y="222">max output tokens</text>

<path class="wire" d="M250 164 H286" marker-end="url(#arr)"/>

<!-- The model: fills the budget -->
<rect class="model-box" x="290" y="84" width="490" height="160" rx="22"/>
<text class="tag txt-model" x="310" y="108">THE MODEL DECIDES HOW MUCH TO THINK</text>
<text class="sub txt-mute" x="310" y="128">inside the budget; in adaptive modes, whether to think at all</text>
<rect class="track" x="310" y="148" width="440" height="36"/>
<rect class="think" x="310" y="148" width="250" height="36"/>
<rect class="answer" x="560" y="148" width="90" height="36"/>
<text class="lbl txt" x="435" y="171" text-anchor="middle">hidden thinking tokens</text>
<text class="lbl-b answer-t" x="605" y="171" text-anchor="middle">answer</text>
<line class="cap" x1="750" y1="140" x2="750" y2="194"/>
<text class="sub txt-code" x="750" y="212" text-anchor="middle">output cap</text>
<text class="sub txt-mute" x="310" y="204">hidden; you may see a summary</text>
<text class="sub txt-mute" x="560" y="204">visible</text>

<!-- Billing: both streams, one count -->
<path class="wire" d="M310 254 V264 H650 V254 M480 264 V280" marker-end="url(#arr)"/>
<rect class="data-box" x="345" y="284" width="270" height="46" rx="4"/>
<text class="lbl-b txt" x="480" y="303" text-anchor="middle">one billed output-token count</text>
<text class="mono txt-mute" x="480" y="321" text-anchor="middle">thinking + answer</text>

<!-- Feedback: chosen level back into config -->
<path class="wire" d="M135 350 V248" marker-end="url(#arr)"/>
<text class="sub txt-code" x="146" y="292">chosen level goes</text>
<text class="sub txt-code" x="146" y="308">back into the config</text>

<!-- Your code: the eval sweep -->
<rect class="code-box" x="20" y="350" width="760" height="190"/>
<text class="tag txt-code" x="36" y="374">YOUR CODE MEASURES: THE EVAL SWEEP</text>
<text class="sub txt-mute" x="36" y="394">the chapter's scripted run (invented numbers): same cases, same grader, every level</text>

<text class="sub txt-mute" x="36" y="420">level</text>
<text class="sub txt-mute" x="120" y="420">output tokens billed</text>
<text class="sub txt-mute" x="430" y="420">quality</text>
<text class="sub txt-mute" x="615" y="420">verdict</text>

<rect class="pick" x="28" y="481" width="744" height="24" rx="4"/>
<!-- none -->
<text class="lbl txt" x="36" y="445">none</text>
<rect class="answer" x="120" y="433" width="3" height="14"/>
<text class="mono txt-mute" x="129" y="445">120</text>
<rect class="qual" x="430" y="433" width="75" height="14"/>
<text class="mono txt-mute" x="511" y="445">0.50</text>
<text class="lbl txt-mute" x="615" y="445">misses the desk</text>
<!-- low -->
<text class="lbl txt" x="36" y="471">low</text>
<rect class="think" x="120" y="459" width="25" height="14"/>
<rect class="answer" x="145" y="459" width="3" height="14"/>
<text class="mono txt-mute" x="154" y="471">1,920</text>
<rect class="qual" x="430" y="459" width="75" height="14"/>
<text class="mono txt-mute" x="511" y="471">0.50</text>
<text class="lbl txt-mute" x="615" y="471">same miss, more tokens</text>
<!-- medium -->
<text class="lbl-b txt" x="36" y="497">medium</text>
<rect class="think" x="120" y="485" width="90" height="14"/>
<rect class="answer" x="210" y="485" width="3" height="14"/>
<text class="mono txt-mute" x="219" y="497">6,420</text>
<rect class="qual" x="430" y="485" width="150" height="14"/>
<text class="mono txt-mute" x="586" y="497">1.00</text>
<text class="lbl-b txt-code" x="615" y="497">cheapest that holds</text>
<!-- high -->
<text class="lbl txt" x="36" y="523">high</text>
<rect class="think" x="120" y="511" width="217" height="14"/>
<rect class="answer" x="337" y="511" width="3" height="14"/>
<text class="mono txt-mute" x="346" y="523">15,120</text>
<rect class="qual" x="430" y="511" width="75" height="14"/>
<text class="mono txt-mute" x="511" y="523">0.50</text>
<text class="lbl txt-mute" x="615" y="523">overthinks easy case</text>
</svg>
