<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-labelledby="ttl desc">
<title id="ttl">Plan-and-execute: the model writes the plan, your code decides when to ask it again</title>
<desc id="desc">Two lanes. The top lane is plan-and-execute with a code-owned replan trigger, drawn from one listing's run. A rounded planner, the model, writes plan 1: draft_copy, set_price 34900, write_email. A rectangle, your code, checks the plan's shape before any step runs, and it passes. Code runs draft_copy, which succeeds without calling the model. Code runs set_price 34900, which fails because 34900 is below the MAP of 39900, so write_email from plan 1 never runs. That failure is the only replan trigger, and the run allows one replan; a second failure would halt it. Code asks the planner again with what already ran and the failure text. The planner writes plan 2: set_price 39900, write_email. Code checks it again before any step, both steps succeed, and code ends the run with status done. The model was called twice. The bottom lane is the step-by-step loop for contrast: the model is consulted after every step, so model calls alternate with draft_copy, set_price and write_email, and the model decides when the run is done. A model call after every successful step in a trace means you built the step-by-step loop.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 20px; font-weight: 700; }
  .card-t { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .tag-lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  .sub { font-size: 12px; }
  .sub-s { font-size: 11px; }
  .mono-t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
  .mono-s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
  .count-lbl { font-size: 15px; font-weight: 800; }
  .code-box, .model-box, .data-box, .fail-box { stroke-width: 2; }
  .data-box { stroke-dasharray: 5 4; }
  .wire { fill: none; stroke-width: 2; }
  .wire-fail { fill: none; stroke-width: 2; }
  .ghost { stroke-dasharray: 5 5; stroke-width: 1.5; }
  .rule { stroke-width: 1; }

  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .fail-box { fill: #fdecea; stroke: #e53935; }
  .ghost { fill: none; stroke: #aab2c4; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #7e57c2; }
  .txt-ok { fill: #00796b; }
  .txt-fail { fill: #c62828; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .wire-fail { stroke: #e53935; }  .mk-fail { fill: #e53935; }
  .rule { stroke: #e2e6ef; }

  @media (prefers-color-scheme: dark) {
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .data-box { fill: #1b1f29; stroke: #5a6478; }
  .fail-box { fill: #3a2226; stroke: #ff6b66; }
  .ghost { stroke: #5a6478; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #b39ddb; }
  .txt-ok { fill: #4db6ac; }
  .txt-fail { fill: #ff8a80; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .wire-fail { stroke: #ff6b66; }  .mk-fail { fill: #ff6b66; }
  .rule { stroke: #2b3140; }
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arw-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fail" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<text class="h1 txt" x="16" y="30">Plan once, and ask the model again only when your code says so</text>
<text class="sub txt-mute" x="16" y="52">One listing's run. Rounded: the model decides. Rectangle: your code decides. Dashed: the plan, a typed artifact.</text>

<!-- Lane A: plan-and-execute -->
<text class="tag-lbl txt-code" x="16" y="84">PLAN-AND-EXECUTE, TRIGGER-BASED REPLAN</text>
<text class="count-lbl txt-model" x="768" y="85" text-anchor="end">model calls: 2</text>

<!-- Row 1 -->
<rect class="model-box" x="16" y="100" width="100" height="60" rx="30"/>
<text class="card-t txt" x="66" y="127" text-anchor="middle">Planner</text>
<text class="sub-s txt-mute" x="66" y="144" text-anchor="middle">writes plan 1</text>
<path class="wire" d="M116,130 L126,130" marker-end="url(#arw)"/>

<rect class="data-box" x="128" y="96" width="144" height="68" rx="6"/>
<text class="card-t txt" x="140" y="114">plan 1</text>
<text class="mono-t txt" x="140" y="131">1 draft_copy</text>
<text class="mono-t txt" x="140" y="145">2 set_price 34900</text>
<text class="mono-t txt" x="140" y="159">3 write_email</text>
<path class="wire" d="M272,130 L282,130" marker-end="url(#arw)"/>

<rect class="code-box" x="284" y="100" width="110" height="60" rx="4"/>
<text class="card-t txt" x="339" y="120" text-anchor="middle">Checks shape</text>
<text class="sub-s txt-mute" x="339" y="136" text-anchor="middle">before any step</text>
<text class="sub-s txt-ok" x="339" y="152" text-anchor="middle">passes</text>
<path class="wire" d="M394,130 L404,130" marker-end="url(#arw)"/>

<rect class="code-box" x="406" y="100" width="108" height="60" rx="4"/>
<text class="mono-s txt" x="460" y="124" text-anchor="middle">draft_copy</text>
<text class="sub-s txt-ok" x="460" y="144" text-anchor="middle">ok, no model call</text>
<path class="wire" d="M514,130 L524,130" marker-end="url(#arw)"/>

<rect class="fail-box" x="526" y="100" width="120" height="60" rx="4"/>
<text class="mono-s txt" x="586" y="120" text-anchor="middle">set_price 34900</text>
<text class="sub-s txt-fail" x="586" y="137" text-anchor="middle">fails: below</text>
<text class="sub-s txt-fail" x="586" y="152" text-anchor="middle">MAP 39900</text>
<path class="wire" d="M646,130 L656,130" stroke-dasharray="3 3"/>

<rect class="ghost" x="658" y="100" width="110" height="60" rx="4"/>
<text class="mono-s txt-mute" x="713" y="124" text-anchor="middle">write_email</text>
<text class="sub-s txt-mute" x="713" y="144" text-anchor="middle">never runs</text>

<!-- The code-owned trigger -->
<path class="wire-fail" d="M586,160 L586,174" marker-end="url(#arw-fail)"/>
<rect class="code-box" x="406" y="176" width="362" height="40" rx="4"/>
<text class="card-t txt" x="418" y="193">A failed step is the only replan trigger</text>
<text class="sub-s txt-mute" x="418" y="209">Replans allowed: 1. A second failure halts the run.</text>
<path class="wire-fail" d="M406,196 L66,196 L66,238" marker-end="url(#arw-fail)"/>
<text class="sub-s txt-mute" x="128" y="189">asks again with what ran and the failure</text>

<!-- Row 2 -->
<rect class="model-box" x="16" y="240" width="100" height="60" rx="30"/>
<text class="card-t txt" x="66" y="267" text-anchor="middle">Planner</text>
<text class="sub-s txt-mute" x="66" y="284" text-anchor="middle">writes plan 2</text>
<path class="wire" d="M116,270 L126,270" marker-end="url(#arw)"/>

<rect class="data-box" x="128" y="243" width="144" height="54" rx="6"/>
<text class="card-t txt" x="140" y="261">plan 2</text>
<text class="mono-t txt" x="140" y="277">1 set_price 39900</text>
<text class="mono-t txt" x="140" y="291">2 write_email</text>
<path class="wire" d="M272,270 L282,270" marker-end="url(#arw)"/>

<rect class="code-box" x="284" y="240" width="110" height="60" rx="4"/>
<text class="card-t txt" x="339" y="260" text-anchor="middle">Checks again</text>
<text class="sub-s txt-mute" x="339" y="276" text-anchor="middle">before any step</text>
<text class="sub-s txt-ok" x="339" y="292" text-anchor="middle">passes</text>
<path class="wire" d="M394,270 L404,270" marker-end="url(#arw)"/>

<rect class="code-box" x="406" y="240" width="120" height="60" rx="4"/>
<text class="mono-s txt" x="466" y="264" text-anchor="middle">set_price 39900</text>
<text class="sub-s txt-ok" x="466" y="284" text-anchor="middle">ok</text>
<path class="wire" d="M526,270 L536,270" marker-end="url(#arw)"/>

<rect class="code-box" x="538" y="240" width="110" height="60" rx="4"/>
<text class="mono-s txt" x="593" y="264" text-anchor="middle">write_email</text>
<text class="sub-s txt-ok" x="593" y="284" text-anchor="middle">ok</text>
<path class="wire" d="M648,270 L658,270" marker-end="url(#arw)"/>

<rect class="code-box" x="660" y="240" width="108" height="60" rx="4"/>
<text class="card-t txt" x="714" y="266" text-anchor="middle">status: done</text>
<text class="sub-s txt-mute" x="714" y="283" text-anchor="middle">code ends the run</text>

<text class="sub-s txt-mute" x="16" y="326">The model is called to plan and again on the failure. A step that succeeds never reaches it.</text>

<line class="rule" x1="16" y1="346" x2="784" y2="346"/>

<!-- Lane B: the step-by-step loop -->
<text class="tag-lbl txt-model" x="16" y="374">FOR CONTRAST: THE STEP-BY-STEP LOOP (2.5)</text>
<text class="count-lbl txt-model" x="784" y="375" text-anchor="end">model calls: one per step</text>

<rect class="model-box" x="16" y="392" width="96" height="50" rx="25"/>
<text class="card-t txt" x="64" y="413" text-anchor="middle">Model</text>
<text class="sub-s txt-mute" x="64" y="429" text-anchor="middle">picks next</text>
<path class="wire" d="M112,417 L126,417" marker-end="url(#arw)"/>
<rect class="code-box" x="128" y="392" width="96" height="50" rx="4"/>
<text class="mono-s txt" x="176" y="413" text-anchor="middle">draft_copy</text>
<text class="sub-s txt-mute" x="176" y="429" text-anchor="middle">runs it</text>
<path class="wire" d="M224,417 L238,417" marker-end="url(#arw)"/>
<rect class="model-box" x="240" y="392" width="96" height="50" rx="25"/>
<text class="card-t txt" x="288" y="413" text-anchor="middle">Model</text>
<text class="sub-s txt-mute" x="288" y="429" text-anchor="middle">picks next</text>
<path class="wire" d="M336,417 L350,417" marker-end="url(#arw)"/>
<rect class="code-box" x="352" y="392" width="96" height="50" rx="4"/>
<text class="mono-s txt" x="400" y="413" text-anchor="middle">set_price</text>
<text class="sub-s txt-mute" x="400" y="429" text-anchor="middle">runs it</text>
<path class="wire" d="M448,417 L462,417" marker-end="url(#arw)"/>
<rect class="model-box" x="464" y="392" width="96" height="50" rx="25"/>
<text class="card-t txt" x="512" y="413" text-anchor="middle">Model</text>
<text class="sub-s txt-mute" x="512" y="429" text-anchor="middle">picks next</text>
<path class="wire" d="M560,417 L574,417" marker-end="url(#arw)"/>
<rect class="code-box" x="576" y="392" width="96" height="50" rx="4"/>
<text class="mono-s txt" x="624" y="413" text-anchor="middle">write_email</text>
<text class="sub-s txt-mute" x="624" y="429" text-anchor="middle">runs it</text>
<path class="wire" d="M672,417 L686,417" marker-end="url(#arw)"/>
<rect class="model-box" x="688" y="392" width="96" height="50" rx="25"/>
<text class="card-t txt" x="736" y="413" text-anchor="middle">Model</text>
<text class="sub-s txt-mute" x="736" y="429" text-anchor="middle">decides done</text>

<text class="sub-s txt-mute" x="16" y="470">Read the trace: a model call after every successful step means you built this loop.</text>
</svg>
