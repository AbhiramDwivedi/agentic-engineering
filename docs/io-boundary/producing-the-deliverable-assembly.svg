<text class="sub txt-flag" x="400" y="141" text-anchor="middle">half a sentence</text>
<text class="mono txt-flag" x="400" y="159" text-anchor="middle">truncated</text>

<rect class="data-box" x="483" y="102" width="140" height="68" rx="4"/>
<text class="card-t txt" x="553" y="122" text-anchor="middle">Description</text>
<text class="sub txt-flag" x="553" y="141" text-anchor="middle">60 × 28 in</text>
<text class="mono txt-mute" x="553" y="159" text-anchor="middle">ok</text>

<rect class="data-box" x="636" y="102" width="140" height="68" rx="4"/>
<text class="card-t txt" x="706" y="122" text-anchor="middle">Highlights</text>
<text class="sub txt" x="706" y="141" text-anchor="middle">selling points</text>
<text class="mono txt-mute" x="706" y="159" text-anchor="middle">ok</text>

<!-- code reorders: arrival -> template slot -->
<path class="wire" d="M94,170 C94,195 706,195 706,222" marker-end="url(#arw)"/>
<path class="wire" d="M247,170 L247,222" marker-end="url(#arw)"/>
<path class="wire-bad" d="M400,170 C400,195 553,195 553,222" marker-end="url(#arwbad)"/>
<path class="wire" d="M553,170 C553,195 94,195 94,222" marker-end="url(#arw)"/>
<path class="wire" d="M706,170 C706,195 400,195 400,222" marker-end="url(#arw)"/>

<rect class="code-box" x="16" y="212" width="768" height="104" rx="6"/>
<rect class="slot-box" x="24" y="224" width="140" height="52" rx="3"/>
<text class="card-t txt" x="94" y="245" text-anchor="middle">Description</text>
<text class="sub txt-mute" x="94" y="264" text-anchor="middle">required · src ids</text>
<rect class="slot-box" x="177" y="224" width="140" height="52" rx="3"/>
<text class="card-t txt" x="247" y="245" text-anchor="middle">Specifications</text>
<text class="sub txt-mute" x="247" y="264" text-anchor="middle">required · src ids</text>
<rect class="slot-box" x="330" y="224" width="140" height="52" rx="3"/>
<text class="card-t txt" x="400" y="245" text-anchor="middle">Highlights</text>
<text class="sub txt-mute" x="400" y="264" text-anchor="middle">required · src ids</text>
<rect class="slot-empty" x="483" y="224" width="140" height="52" rx="3"/>
<text class="card-t txt" x="553" y="245" text-anchor="middle">Prop 65 notice</text>
<text class="sub txt-flag" x="553" y="264" text-anchor="middle">required · empty</text>
<rect class="slot-box" x="636" y="224" width="140" height="52" rx="3"/>
<text class="card-t txt" x="706" y="245" text-anchor="middle">FAQ</text>
<text class="sub txt-mute" x="706" y="264" text-anchor="middle">optional · src ids</text>
<text class="sub txt-code" x="24" y="302"><tspan font-weight="700">Template, your code:</tspan> which slots exist, in what order, and the source ids that ride with each</text>

<path class="wire" d="M400,316 L400,338" marker-end="url(#arw)"/>
<rect class="code-box" x="16" y="340" width="768" height="78" rx="6"/>
<text class="card-t txt-code" x="32" y="362">Seam checks, your code</text>
<text class="sub txt" x="32" y="384">Size: Description says 60 × 28 in, Specifications 60 × 30 in <tspan class="txt-flag" font-weight="700">→ the spec table wins</tspan></text>
<text class="sub txt" x="32" y="405">FAQ repeats the Description's opening line <tspan class="txt-flag" font-weight="700">→ reword only that pair</tspan></text>

<path class="wire" d="M400,418 L400,440" marker-end="url(#arw)"/>
<rect class="model-box" x="96" y="442" width="608" height="58" rx="29"/>
