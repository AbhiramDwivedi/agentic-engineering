<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690" role="img" aria-labelledby="ttl desc">
<title id="ttl">Synthesis: your code assembles the page and checks the seams; the model edits it once</title>
<desc id="desc">Five section results for the Aldsworth desk listing arrive in any order, each from its own model call: FAQ, which repeats the description's opening line; Specifications, stating 60 by 30 inches and 250 lbs; the Prop 65 notice, truncated at max_tokens with half a sentence; Description, stating 60 by 28 inches; and Highlights. Wires cross as code places each result into a code-owned template with fixed slots in a fixed order (Description, Specifications, Highlights, Prop 65 notice, FAQ), source ids attached; the required Prop 65 slot is empty. Code seam checks then find that the two sections disagree on the desktop size, and the spec table wins, and that the FAQ repeats the description, so only that pair is reworded. The one rounded shape is the model's editing pass, run once to even out voice; it turns "supports up to 250 lbs" into "built for 300 lbs". A code fidelity diff reports dropped 250 and added 300, so the unpolished page is kept. A code publish gate then blocks the page because the required Prop 65 notice is truncated; the other exit, ready for a person to approve, is not taken on this run.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h1 { font-size: 18px; font-weight: 700; }
  .h2 { font-size: 12.5px; }
  .card-t { font-size: 13px; font-weight: 700; }
  .tag-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; }
  .sub { font-size: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
  .code-box, .model-box, .data-box, .flag-box { stroke-width: 2; }
  .data-box { stroke-dasharray: 5 4; }
  .slot-box { stroke-width: 1.5; }
  .slot-empty { stroke-width: 1.8; stroke-dasharray: 4 3; }
  .wire { fill: none; stroke-width: 2; }
  .wire-bad { fill: none; stroke-width: 2; stroke-dasharray: 4 3; }
  .ghost { stroke-dasharray: 5 5; stroke-width: 1.5; }

  .page-bg { fill: #ffffff; stroke: #e2e6ef; stroke-width: 1; }
  .code-box { fill: #eef1f9; stroke: #4f5b93; }
  .model-box { fill: #f4ecfc; stroke: #7e57c2; }
  .data-box { fill: #fbfbfd; stroke: #aab2c4; }
  .slot-box { fill: #ffffff; stroke: #8f99c4; }
  .slot-empty { fill: #fdf3f2; stroke: #b3261e; }
  .flag-box { fill: #fdf3f2; stroke: #b3261e; }
  .ghost { fill: none; stroke: #aab2c4; }
  .txt { fill: #1f2430; }
  .txt-mute { fill: #5b6377; }
  .txt-code { fill: #4f5b93; }
  .txt-model { fill: #7e57c2; }
  .txt-flag { fill: #b3261e; }
  .wire { stroke: #97a0b5; }  .mk-wire { fill: #97a0b5; }
  .wire-bad { stroke: #b3261e; }  .mk-bad { fill: #b3261e; }

  @media (prefers-color-scheme: dark) {
  .page-bg { fill: #21222c; stroke: #2b3140; }
  .code-box { fill: #262b3d; stroke: #939ed4; }
  .model-box { fill: #332a4a; stroke: #b39ddb; }
  .data-box { fill: #1b1f29; stroke: #5a6478; }
  .slot-box { fill: #1b1f29; stroke: #6f7aa8; }
  .slot-empty { fill: #3a2326; stroke: #f2b8b5; }
  .flag-box { fill: #3a2326; stroke: #f2b8b5; }
  .ghost { stroke: #5a6478; }
  .txt { fill: #e6e8ee; }
  .txt-mute { fill: #a2abc0; }
  .txt-code { fill: #939ed4; }
  .txt-model { fill: #b39ddb; }
  .txt-flag { fill: #f2b8b5; }
  .wire { stroke: #78829a; }  .mk-wire { fill: #78829a; }
  .wire-bad { stroke: #f2b8b5; }  .mk-bad { fill: #f2b8b5; }
  }
</style>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-wire" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="arwbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-bad" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="page-bg" x="0.5" y="0.5" width="799" height="689" rx="8"/>

<text class="h1 txt" x="24" y="34">Every failure lives at a seam, and code is standing at each one</text>
<rect class="code-box" x="24" y="50" width="22" height="14" rx="3"/><text class="sub txt-mute" x="52" y="61">your code decides</text>
<rect class="model-box" x="170" y="50" width="22" height="14" rx="7"/><text class="sub txt-mute" x="198" y="61">the model decides</text>
<rect class="data-box" x="320" y="50" width="22" height="14" rx="2"/><text class="sub txt-mute" x="348" y="61">data passed along</text>
<text class="sub txt-flag" x="480" y="61">red: a failure, and where it is caught</text>

<text class="tag-lbl txt-mute" x="24" y="92">FIVE SECTION RESULTS, EACH FROM ITS OWN MODEL CALL, ARRIVING IN ANY ORDER</text>
<!-- arrival order: FAQ, Specifications, Prop 65, Description, Highlights -->
<rect class="data-box" x="24" y="102" width="140" height="68" rx="4"/>
<text class="card-t txt" x="94" y="122" text-anchor="middle">FAQ</text>
<text class="sub txt-flag" x="94" y="141" text-anchor="middle">repeats opening line</text>
<text class="mono txt-mute" x="94" y="159" text-anchor="middle">ok</text>

