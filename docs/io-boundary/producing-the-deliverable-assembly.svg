<text class="card-t txt" x="247" y="122" text-anchor="middle">Specifications</text>
<text class="sub txt" x="247" y="141" text-anchor="middle">60 × 30 in · 250 lbs</text>
<text class="mono txt-mute" x="247" y="159" text-anchor="middle">ok</text>

<rect class="flag-box" x="330" y="102" width="140" height="68" rx="4" stroke-dasharray="5 4"/>
